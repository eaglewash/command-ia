<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/icon-192.png">
  <link rel="apple-touch-icon" href="/icon-512.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0E4B47">
  <meta name="description" content="Commande-IA — gestion de restaurant en temps réel : commandes, cuisine, stocks, réservations.">
  <title>Messagerie — Commande-IA</title>
  <script src="/socket.io/socket.io.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', system-ui, sans-serif; background:#EEF5F2;background-image:radial-gradient(560px circle at top right, rgba(123,187,181,.16), transparent 60%),linear-gradient(rgba(14,75,71,.03) 1px, transparent 1px),linear-gradient(90deg, rgba(14,75,71,.03) 1px, transparent 1px);background-size:auto,44px 44px,44px 44px;background-attachment:fixed;background-repeat:no-repeat,repeat,repeat; min-height: 100vh; color: #0F2A28; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    /* ── TOPBAR ── */
    .topbar { background: #0E4B47; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; height: 56px; flex-shrink: 0; }
    .logo { font-size: 16px; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 8px; }
    .logo span { color: #B8D0C8; }
    .topbar-right { display: flex; align-items: center; gap: 8px; }
    .page-badge { font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; background: rgba(123,187,181,0.15); color: #B8D0C8; padding: 3px 8px; border-radius: 4px; border: 1px solid rgba(123,187,181,0.25); }
    .btn-back { font-size: 12px; font-weight: 600; color: #B8D0C8; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12); padding: 6px 12px; border-radius: 7px; cursor: pointer; text-decoration: none; transition: all 0.15s; display: flex; align-items: center; gap: 5px; }
    .btn-back:hover { background: rgba(255,255,255,0.16); color: #fff; }
    /* user chip */
    .user-chip { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12); border-radius: 9px; padding: 4px 10px 4px 5px; }
    .user-avatar { width: 28px; height: 28px; border-radius: 7px; background: linear-gradient(135deg,#1a6b63,#0a3d3a); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; color: #fff; letter-spacing: -.3px; flex-shrink: 0; }
    .user-name { font-size: 12px; font-weight: 600; color: #fff; max-width: 100px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .user-role { font-size: 9.5px; font-weight: 500; color: #7BBBB5; letter-spacing: .2px; }

    /* ── LAYOUT 2 COLONNES ── */
    .app { display: grid; grid-template-columns: 230px 1fr; flex: 1; min-height: 0; }
    .sidebar-right { display: none; }

    /* ══════════════════════════════
       SIDEBAR GAUCHE — 2 convs fixes
    ══════════════════════════════ */
    .sidebar-left { background: #fff; border-right: 1px solid #e8eeec; display: flex; flex-direction: column; min-height: 0; }

    .sl-head { padding: 18px 16px 14px; border-bottom: 1px solid #eef3f1; flex-shrink: 0; }
    .sl-title { font-size: 14px; font-weight: 800; color: #0F2A28; letter-spacing: -.3px; }
    .sl-sub { font-size: 10px; color: #8aaeaa; margin-top: 2px; font-weight: 500; }

    .conv-list { flex: 1; overflow-y: auto; padding: 10px 10px 10px; display: flex; flex-direction: column; gap: 6px; }

    .conv-item {
      padding: 12px 12px; border-radius: 12px; cursor: pointer;
      display: flex; gap: 11px; align-items: center;
      transition: all 0.14s; border: 1.5px solid transparent;
    }
    .conv-item:hover { background: #F4F8F6; }
    .conv-item.active { background: #EBF5F0; border-color: #C8E8E0; }
    .conv-item.pinned.active { background: #E6F4EF; border-color: #B0DDD2; }

    .conv-avatar {
      width: 44px; height: 44px; border-radius: 13px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .conv-avatar.admin-av { background: linear-gradient(135deg, #0E4B47, #1a7a70); }
    .conv-avatar.auto-av  { background: linear-gradient(135deg, #2a3d8a, #4a60c0); }

    .conv-body { flex: 1; min-width: 0; }
    .conv-name { font-size: 13px; font-weight: 700; color: #0F2A28; display: flex; align-items: center; gap: 5px; }
    .conv-pin { font-size: 10px; opacity: .6; }
    .conv-preview { font-size: 11px; color: #7a9a95; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.4; }

    .conv-badge {
      display: flex; align-items: center; justify-content: center;
      background: #e05555; color: #fff; font-size: 9px; font-weight: 800;
      min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; flex-shrink: 0;
    }

    /* ── Sélecteur restaurant (admin) ── */
    .resto-selector {
      margin-top: 5px; background: #F4F8F6; border: 1px solid #dceee8; border-radius: 7px;
      padding: 5px 10px; font-size: 12px; font-family: 'Inter',sans-serif;
      color: #0F2A28; outline: none; cursor: pointer; max-width: 280px;
    }
    .resto-selector:focus { border-color: #0E4B47; }

    /* ══════════════════════════════
       ZONE CHAT CENTRALE
    ══════════════════════════════ */
    .chat-area { display: flex; flex-direction: column; min-height: 0; background: #F2F7F4; }

    /* Header de la conv */
    .chat-head {
      padding: 12px 20px; background: #fff; border-bottom: 1px solid #eef3f1;
      display: flex; align-items: center; gap: 12px; flex-shrink: 0;
    }
    .chat-head-avatar {
      width: 36px; height: 36px; border-radius: 10px;
      background: linear-gradient(145deg,#1a5a3a,#0E4B47);
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 800; color: #fff; flex-shrink: 0;
    }
    .chat-head-name { font-size: 14px; font-weight: 700; color: #0F2A28; }
    .chat-head-sub { font-size: 11px; color: #8aaeaa; margin-top: 1px; }
    .chat-head-actions { margin-left: auto; display: flex; gap: 6px; }
    .chat-btn {
      padding: 5px 12px; border-radius: 7px; border: none;
      background: #F4F8F6; font-size: 11px; font-weight: 600; color: #0E4B47;
      cursor: pointer; font-family:'Inter',sans-serif; transition: all 0.12s;
    }
    .chat-btn:hover { background: #DCF0ED; }
    .chat-btn.danger { color: #b03030; background: #fef0f0; }
    .chat-btn.danger:hover { background: #fce0e0; }

    /* Messages */
    .messages-area {
      flex: 1; overflow-y: auto; padding: 24px 40px;
      display: flex; flex-direction: column; gap: 4px;
    }
    .chat-empty { margin: auto; text-align: center; opacity: .5; }
    .chat-empty-icon { font-size: 36px; margin-bottom: 10px; }
    .chat-empty-text { font-size: 13px; color: #7a9a95; line-height: 1.6; }

    /* Groupe de messages consécutifs du même expéditeur */
    .msg-group { display: flex; flex-direction: column; gap: 2px; margin-bottom: 10px; }
    .msg-group.from-admin { align-items: flex-end; }
    .msg-group.from-restaurant { align-items: flex-start; }

    /* Ligne individuelle (avatar + bulle) */
    .msg-row { display: flex; gap: 8px; align-items: flex-end; }
    .msg-row.from-admin { flex-direction: row-reverse; }

    .msg-avatar {
      width: 26px; height: 26px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 10px; font-weight: 700; color: #fff; flex-shrink: 0; align-self: flex-end;
    }
    .msg-avatar.admin     { background: #0E4B47; }
    .msg-avatar.restaurant{ background: #2a8a60; }
    .msg-avatar.system    { background: #1a3a8a; }

    .msg-bubble { max-width: 58%; display: flex; flex-direction: column; }
    .msg-row.from-admin .msg-bubble { align-items: flex-end; }

    .msg-content {
      padding: 9px 13px; font-size: 13px; line-height: 1.55;
      border-radius: 16px; word-break: break-word;
    }
    /* Bulle reçue */
    .from-restaurant .msg-content, .from-system .msg-content {
      background: #fff; color: #0F2A28;
      border-bottom-left-radius: 5px;
      box-shadow:0 1px 3px rgba(14,75,71,.07);
    }
    /* Bulle envoyée (admin) */
    .from-admin .msg-content {
      background: #0E4B47; color: #d8f0e4;
      border-bottom-right-radius: 5px;
    }
    .msg-content.restock { background: #FFF8E8; color: #5a3a00; box-shadow:0 1px 3px rgba(14,75,71,.07); }
    .msg-content.system  { background: #EEF2FF; color: #1a3a8a; box-shadow:0 1px 3px rgba(14,75,71,.07); }

    .msg-meta {
      font-size: 10px; color: #b0c8c4; margin-top: 3px;
      display: flex; align-items: center; gap: 5px;
    }
    .msg-row.from-admin .msg-meta { flex-direction: row-reverse; }
    .msg-read { color: #5ecf60; font-size: 11px; }
    .msg-dismiss-btn { background: none; border: none; cursor: pointer; color: #ccc; font-size: 13px; padding: 0 2px; transition: color 0.1s; }
    .msg-dismiss-btn:hover { color: #e05555; }

    /* Cards restock dans bulle */
    .restock-card { margin-top: 8px; background: rgba(255,255,255,.65); border-radius: 9px; padding: 9px 11px; border: 1px solid rgba(240,200,100,.35); }
    .restock-item-line { display: flex; align-items: center; gap: 6px; font-size: 11px; padding: 3px 0; color: #5a3a00; }
    .restock-urgency { display: inline-block; width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .restock-urgency.critique { background: #e05555; }
    .restock-urgency.urgent   { background: #e08a10; }
    .restock-urgency.attention{ background: #c0a010; }

    /* Séparateur date */
    .date-sep {
      display: flex; align-items: center; gap: 10px;
      margin: 12px 0 8px; color: #b0c8c4; font-size: 10px; font-weight: 600;
      text-transform: uppercase; letter-spacing: .8px;
    }
    .date-sep::before, .date-sep::after { content:''; flex:1; height:1px; background:#e4edea; }

    /* Zone de saisie */
    .chat-input-area {
      padding: 12px 40px 16px; background: #F2F7F4; flex-shrink: 0;
    }
    .chat-input-wrap {
      display: flex; gap: 8px; align-items: flex-end;
      background: #fff; border-radius: 14px;
      padding: 8px 8px 8px 14px;
      box-shadow:0 2px 12px rgba(14,75,71,.10);
    }
    .chat-textarea {
      flex: 1; background: transparent; border: none;
      font-size: 13px; font-family: 'Inter',sans-serif; outline: none;
      resize: none; min-height: 22px; max-height: 120px; overflow-y: auto;
      color: #0F2A28; line-height: 1.5;
    }
    .chat-textarea::placeholder { color: #aac8c2; }
    .chat-send-btn {
      width: 36px; height: 36px; border-radius: 10px;
      background: #0E4B47; border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s, transform 0.1s; flex-shrink: 0;
    }
    .chat-send-btn:hover { background: #0a3a36; transform: scale(1.05); }
    .chat-input-hint { font-size: 10px; color: #b8ccc8; margin-top: 6px; text-align: center; }

    /* ══════════════════════════════
       SIDEBAR DROITE
    ══════════════════════════════ */
    .sidebar-right { background: #fff; border-left: 1px solid #e8eeec; display: flex; flex-direction: column; min-height: 0; overflow-y: auto; }
    .sr-head { padding: 14px 16px 12px; border-bottom: 1px solid #eef3f1; }
    .sr-title { font-size: 13px; font-weight: 700; color: #0F2A28; }
    .sr-section { padding: 12px 16px; border-bottom: 1px solid #eef3f1; }
    .sr-section-title { font-size: 9.5px; font-weight: 800; color: #8aaeaa; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; display: flex; align-items: center; gap: 5px; }
    .info-row { display: flex; justify-content: space-between; align-items: center; font-size: 11px; padding: 4px 0; }
    .info-key { color: #8aaeaa; }
    .info-val { color: #0F2A28; font-weight: 600; }
    .restock-rec { background: #F8FBF9; border: 1.5px solid #dceee8; border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
    .restock-rec.critique { background: #fef6f6; border-color: #f5c5c5; }
    .restock-rec.urgent   { background: #fffbf0; border-color: #f5e098; }
    .restock-rec.attention{ background: #fdfdf0; border-color: #e8e898; }
    .restock-nom { font-size: 12px; font-weight: 700; color: #0F2A28; }
    .restock-detail { font-size: 11px; color: #6a8a80; margin-top: 2px; line-height: 1.5; }
    .restock-send-btn { margin-top: 7px; font-size: 10px; font-weight: 700; padding: 4px 10px; border-radius: 6px; background: #DCF0ED; border: none; color: #0E4B47; cursor: pointer; font-family:'Inter',sans-serif; transition: all 0.12s; }
    .restock-send-btn:hover { background: #c4e4dc; }
    .urgency-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 4px; }
    .urgency-dot.critique { background: #e05555; }
    .urgency-dot.urgent   { background: #e08a10; }
    .urgency-dot.attention{ background: #c0a010; }

    /* ── BROADCAST PANEL (cloche en haut) ── */
    .bc-bell-btn { position: relative; width: 34px; height: 34px; border-radius: 8px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.15s; }
    .bc-bell-btn:hover { background: rgba(255,255,255,0.2); }
    .bc-bell-badge { position: absolute; top: -4px; right: -4px; width: 16px; height: 16px; background: #e05555; border-radius: 50%; font-size: 9px; font-weight: 700; color: #fff; display: none; align-items: center; justify-content: center; border: 2px solid #0E4B47; }
    .bc-bell-badge.show { display: flex; }
    .bc-panel { display: none; position: fixed; top: 66px; right: 16px; width: 340px; background: #fff; border: 1.5px solid #B8D0C8; border-radius: 14px; box-shadow:0 12px 36px rgba(14,75,71,0.14); z-index: 9990; overflow: hidden; }
    .bc-panel.open { display: block; }
    .bc-panel-head { padding: 12px 16px; background: #0E4B47; display: flex; align-items: center; justify-content: space-between; }
    .bc-panel-title { font-size: 13px; font-weight: 700; color: #fff; }
    .bc-panel-close { background: none; border: none; color: rgba(255,255,255,0.6); cursor: pointer; font-size: 18px; }
    .bc-panel-list { max-height: 360px; overflow-y: auto; }
    .bc-notif-item { padding: 12px 16px; border-bottom: 1px solid #CFE0D9; display: flex; align-items: flex-start; gap: 8px; }
    .bc-notif-item:last-child { border-bottom: none; }
    .bc-notif-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; margin-top: 3px; }
    .bc-notif-dot.info { background: #2a50aa; } .bc-notif-dot.warn { background: #e08a10; }
    .bc-notif-dot.success { background: #0E4B47; } .bc-notif-dot.danger { background: #e05555; }
    .bc-notif-msg { font-size: 12px; color: #333; line-height: 1.5; flex: 1; }
    .bc-notif-time { font-size: 10px; color: #bbb; margin-top: 3px; }
    .bc-dismiss-btn { background: none; border: none; color: #ccc; cursor: pointer; font-size: 16px; padding: 0; line-height: 1; flex-shrink: 0; transition: color 0.1s; }
    .bc-dismiss-btn:hover { color: #e05555; }
    .bc-panel-empty { padding: 24px; text-align: center; font-size: 12px; color: #ccc; }

    /* ── SCROLLBAR ── */
    ::-webkit-scrollbar { width: 4px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: #B8D0C8; border-radius: 4px; }
    .messages-area::-webkit-scrollbar { width: 3px; }
  
  </style>

<link rel=stylesheet href=/css/common.css>
  <link rel="stylesheet" href="/css/theme.css">
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <div style="display:flex;align-items:center;gap:12px">
    <div class="logo" id="burger-anchor">Commande<span>IA</span></div>
    <div class="page-badge">Messagerie</div>
  </div>
  <div class="topbar-right">
    <div class="user-chip">
      <div class="user-avatar" id="topbar-avatar">—</div>
      <div>
        <div class="user-name" id="topbar-user">—</div>
        <div class="user-role" id="topbar-role">Admin</div>
      </div>
    </div>
    <div class="bc-bell-btn" onclick="toggleBcPanel()" title="Broadcasts admin">
      <svg width="16" height="16" viewBox="0 0 20 20" fill="none"><path d="M10 2a6 6 0 00-6 6v3l-1.5 2.5h15L16 11V8a6 6 0 00-6-6z" stroke="#B8D0C8" stroke-width="1.5" stroke-linejoin="round"/><path d="M8 16a2 2 0 004 0" stroke="#B8D0C8" stroke-width="1.5"/></svg>
      <div class="bc-bell-badge" id="bc-badge">0</div>
    </div>
    <a href="/" class="btn-back">
      <svg width="13" height="13" viewBox="0 0 16 16" fill="none"><path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Dashboard
    </a>
  </div>
</div>
<script src="/burger-menu.js"></script>

<!-- BROADCAST PANEL -->
<div class="bc-panel" id="bc-panel">
  <div class="bc-panel-head">
    <span class="bc-panel-title"><span data-icon="broadcast"></span> Messages de l'administration</span>
    <button class="bc-panel-close" onclick="toggleBcPanel()"><span data-icon="x"></span></button>
  </div>
  <div class="bc-panel-list" id="bc-panel-list"><div class="bc-panel-empty">Aucun message.</div></div>
</div>

<!-- APP -->
<div class="app">

  <!-- 2 CONVERSATIONS FIXES -->
  <div class="sidebar-left">
    <div class="sl-head">
      <div class="sl-title">Messagerie</div>
      <div class="sl-sub" id="sl-sub">2 conversations</div>
    </div>
    <div class="conv-list">

      <!-- Conv 1 : Administrateur (épinglée, ineffaçable) -->
      <div class="conv-item pinned active" id="conv-admin" onclick="openAdminConv()">
        <div class="conv-avatar admin-av">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <circle cx="10" cy="7" r="3.5" fill="rgba(255,255,255,.95)"/>
            <path d="M3 18c0-3.9 3.1-7 7-7s7 3.1 7 7" stroke="rgba(255,255,255,.9)" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="conv-body">
          <div class="conv-name">Administrateur <span class="conv-pin">📌</span></div>
          <div class="conv-preview" id="admin-preview">Chargement…</div>
        </div>
        <div class="conv-badge" id="admin-badge" style="display:none">0</div>
      </div>

      <!-- Conv 2 : Messages automatiques -->
      <div class="conv-item" id="conv-auto" onclick="openAutoConv()">
        <div class="conv-avatar auto-av">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <rect x="3" y="5" width="14" height="10" rx="2" stroke="rgba(255,255,255,.9)" stroke-width="1.5"/>
            <path d="M7 9h6M7 12h4" stroke="rgba(255,255,255,.9)" stroke-width="1.4" stroke-linecap="round"/>
            <path d="M10 2v3M6 2l1 2M14 2l-1 2" stroke="rgba(255,255,255,.7)" stroke-width="1.2" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="conv-body">
          <div class="conv-name">Messages automatiques</div>
          <div class="conv-preview" id="auto-preview">Alertes · Rappels · Félicitations</div>
        </div>
        <div class="conv-badge" id="auto-badge" style="display:none">0</div>
      </div>

    </div>
  </div>

  <!-- ZONE DE CHAT -->
  <div class="chat-area">
    <div class="chat-head" id="chat-head">
      <div style="width:100%;text-align:center;color:#ccc;font-size:13px">Chargement…</div>
    </div>
    <div class="messages-area" id="messages-area"></div>
    <div class="chat-input-area" id="chat-input-area" style="display:none">
      <div class="chat-input-wrap">
        <textarea class="chat-textarea" id="chat-input" placeholder="Écrire un message…" rows="1" onkeydown="onChatKey(event)"></textarea>
        <button class="chat-send-btn" onclick="sendMessage()">
          <svg width="16" height="16" viewBox="0 0 20 20" fill="none"><path d="M2 10L18 2 10 18 9 11 2 10z" fill="#7BBBB5"/></svg>
        </button>
      </div>
      <div class="chat-input-hint">Entrée pour envoyer · Maj+Entrée pour saut de ligne</div>
    </div>
  </div>

  <!-- Éléments fantômes pour la compatibilité JS (sidebar droite supprimée) -->
  <div style="display:none">
    <div id="sr-title"></div>
    <div id="sr-info"></div>
    <div id="sr-restock"></div>
  </div>
</div>

<script src="/permissions.js"></script>
<script src="/icons.js"></script>
<script>
window.addEventListener('load', () => { try { window.ICONS && window.ICONS.replaceEmojisGlobal && window.ICONS.replaceEmojisGlobal(); } catch(e) {} });
// ── AUTH (système central de hiérarchie) ──
if (typeof requireAuth === 'function') requireAuth();
const userStr = sessionStorage.getItem('user');
if (!userStr) window.location.href = '/login.html?redirect=/messagerie.html';
const currentUser = JSON.parse(userStr || '{}');
const isAdmin = currentUser.role === 'Admin';
const rid = currentUser.restaurantId || '';
const _nom = currentUser.nom || '—';
document.getElementById('topbar-user').textContent = _nom;
document.getElementById('topbar-avatar').textContent = ini(_nom);

// ── STATE ──

let activeRid = null;
let activeConvType = null;  // 'admin' | 'auto'
let restockData = {};
let allRestaurants = [];

const socket = io();

// ── UTILS ──
function ini(name) { return (name||'?').split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2); }
function timeAgo(iso) {
  const diff = Date.now() - new Date(iso);
  if (diff < 60000) return 'À l\'instant';
  if (diff < 3600000) return Math.floor(diff/60000) + 'min';
  if (diff < 86400000) return Math.floor(diff/3600000) + 'h';
  return new Date(iso).toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'});
}
function fmtDate(iso) { return new Date(iso).toLocaleDateString('fr-FR',{day:'2-digit',month:'long',year:'numeric'}); }
function fmtTime(iso) { return new Date(iso).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}); }

// ── INIT ──
async function init() {
  if (isAdmin) {
    document.getElementById('sl-sub').textContent = 'Vue administrateur';
    try {
      const res = await fetch('/admin/restaurants');
      if (res.ok) allRestaurants = await res.json();
    } catch(e) {}
    // Pré-remplir le preview admin avec le dernier message
    updateAdminPreview();
  } else {
    document.getElementById('sl-sub').textContent = currentUser.restaurant || 'Votre compte';
  }
  loadBroadcasts();
  // Ouvrir automatiquement la conv admin
  openAdminConv();
}

function updateAdminPreview() {
  // Met à jour le sous-titre de la conv admin dans la sidebar
  const el = document.getElementById('admin-preview');
  if (!el) return;
  if (isAdmin && allRestaurants.length > 0) {
    el.textContent = allRestaurants.length + ' restaurant' + (allRestaurants.length > 1 ? 's' : '') + ' connecté' + (allRestaurants.length > 1 ? 's' : '');
  } else {
    el.textContent = 'Canal de communication direct';
  }
}

// ── ACTIVATION CONV SIDEBAR ──
function setActiveConv(type) {
  activeConvType = type;
  document.getElementById('conv-admin').classList.toggle('active', type === 'admin');
  document.getElementById('conv-auto').classList.toggle('active', type === 'auto');
}

      <div class="chat-head-avatar admin-av" style="background:linear-gradient(135deg,#0E4B47,#1a7a70)">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <circle cx="10" cy="7" r="3.5" fill="rgba(255,255,255,.95)"/>
          <path d="M3 18c0-3.9 3.1-7 7-7s7 3.1 7 7" stroke="rgba(255,255,255,.9)" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </div>
      <div style="flex:1">
        <div class="chat-head-name">Administrateur</div>
        <select id="resto-select" class="resto-selector" onchange="switchRestoConv(this.value)">
          <option value="">— Choisir un restaurant —</option>
          ${restoOpts}
        </select>
      </div>
      <div class="chat-head-actions" id="admin-actions">
        ${activeRid ? `<button class="chat-btn" onclick="sendRestockAlertActive()"><span data-icon="refresh"></span> Alerte stock</button>
        <button class="chat-btn" onclick="markAllRead('${activeRid}')"><span data-icon="check"></span> Tout lu</button>` : ''}
      </div>`;

    if (activeRid) {
      document.getElementById('chat-input-area').style.display = 'block';
      await loadMessages(activeRid);
    } else {
      document.getElementById('chat-input-area').style.display = 'none';
      document.getElementById('messages-area').innerHTML = `
        <div class="chat-empty">
          <div class="chat-empty-icon"><span data-icon="chat_bubble"></span></div>
          <div class="chat-empty-text">Choisissez un restaurant<br>pour voir la conversation.</div>
        </div>`;
    }
  } else {
    // Vue restaurant : canal direct avec l'admin
    activeRid = rid;
    document.getElementById('chat-head').innerHTML = `
      <div class="chat-head-avatar" style="width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#0E4B47,#1a7a70);display:flex;align-items:center;justify-content:center;flex-shrink:0">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <circle cx="10" cy="7" r="3.5" fill="rgba(255,255,255,.95)"/>
          <path d="M3 18c0-3.9 3.1-7 7-7s7 3.1 7 7" stroke="rgba(255,255,255,.9)" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </div>
      <div>
        <div class="chat-head-name">Administrateur</div>
        <div class="chat-head-sub" id="chat-sub">Canal direct</div>
      </div>
      <div class="chat-head-actions">
        <button class="chat-btn" onclick="markAllRead('${rid}')"><span data-icon="check"></span> Tout lu</button>
      </div>`;
    document.getElementById('chat-input-area').style.display = 'block';
    document.getElementById('chat-input').placeholder = 'Écrire un message à l\'administrateur…';
    await loadMessages(rid);
    fetch(`/messages/${rid}/read-all`, { method:'PATCH', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ by: rid }) });

    // Socket restaurant — messages admin + messages automatiques
    socket.off(`msg_${rid}`);
    socket.on(`msg_${rid}`, msg => {
      const isAuto = msg.from === 'system';
      if (isAuto) {
        // Message automatique → badge sur la conv auto, refresh si ouverte
        if (activeConvType === 'auto') {
          allMsgs.push(msg); renderMessages(); scrollToBottom();
        } else {
          setBadge('auto-badge', (parseInt(document.getElementById('auto-badge').textContent)||0)+1);
        }
      } else {
        // Message admin classique
        if (activeConvType === 'admin') { allMsgs.push(msg); renderMessages(); scrollToBottom(); }
        else { setBadge('admin-badge', (parseInt(document.getElementById('admin-badge').textContent)||0)+1); }
      }
      loadBroadcasts();
    });
  }
  window.ICONS?.replaceAll && window.ICONS.replaceAll(document.getElementById('chat-head'));
}

// ── ADMIN: changer de restaurant ──
async function switchRestoConv(restaurantId) {
  if (!restaurantId) return;
  activeRid = restaurantId;
  const nom = allRestaurants.find(r => r.id === restaurantId)?.nom || 'Restaurant';
  document.getElementById('chat-input-area').style.display = 'block';
  document.getElementById('chat-input').placeholder = `Message pour ${nom}…`;
  const actions = document.getElementById('admin-actions');
  if (actions) {
    actions.innerHTML = `<button class="chat-btn" onclick="sendRestockAlertActive()"><span data-icon="refresh"></span> Alerte stock</button>
      <button class="chat-btn" onclick="markAllRead('${restaurantId}')"><span data-icon="check"></span> Tout lu</button>`;
    window.ICONS?.replaceAll && window.ICONS.replaceAll(actions);
  }
  await loadMessages(restaurantId);
  // Marquer automatiquement comme lus dès l'ouverture de la conv
  fetch(`/messages/${restaurantId}/read-all`, {
    method:'PATCH', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ by: 'admin' })
  });
  // Socket
  socket.off(`msg_${restaurantId}`);
  socket.on(`msg_${restaurantId}`, msg => {
    if (activeRid === restaurantId && activeConvType === 'admin') {
      allMsgs.push(msg); renderMessages(); scrollToBottom();
      // Marquer lu immédiatement car la conv est ouverte
      fetch(`/messages/${restaurantId}/${msg.id}/read`, {
        method:'PATCH', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ by: 'admin' })
      });
    }
  });
}

function sendRestockAlertActive() { if (activeRid) sendRestockAlert(activeRid); }

async function loadAutoMessages() {
  const area = document.getElementById('messages-area');
  area.innerHTML = `<div class="chat-empty"><div class="chat-empty-icon"><span data-icon="timer"></span></div><div class="chat-empty-text">Chargement…</div></div>`;

  const targetRid = isAdmin ? (allRestaurants[0]?.id) : rid;
  let autoMsgs = [];

  if (targetRid) {
    try {
      const res = await fetch(`/messages/${targetRid}`);
      if (res.ok) {
        const all = await res.json();
        autoMsgs = all.filter(m => m.type && m.type !== 'message');
      }
    } catch(e) {}
  }

  // Ajouter les broadcasts comme messages auto
  bcList.forEach(b => {
    autoMsgs.push({
      id: 'bc_' + b.id,
      from: 'system',
      fromName: b.author || 'Système',
      content: b.message,
      type: 'broadcast',
      timestamp: b.createdAt,
      readBy: ['admin']
    });
  });
  autoMsgs.sort((a,b) => new Date(a.timestamp) - new Date(b.timestamp));

  if (!autoMsgs.length) {
    area.innerHTML = `<div class="chat-empty">
      <div class="chat-empty-icon" style="font-size:32px">🤖</div>
      <div class="chat-empty-text">Aucun message automatique.<br>
        <span style="font-size:11px;opacity:.7">Les alertes de stock, rappels quotidiens<br>et félicitations apparaîtront ici.</span>
      </div>
    </div>`;
    return;
  }

  allMsgs = autoMsgs;
  renderMessages();
  scrollToBottom();
}

// ── BADGE HELPERS ──
function setBadge(id, n) {
  const el = document.getElementById(id);
  if (!el) return;
  if (n > 0) { el.textContent = n > 9 ? '9+' : n; el.style.display = 'flex'; }
  else { el.style.display = 'none'; }
}

// ── LEGACY: openConversation reste pour sendRestockAlert et compatibilité ──
async function loadAllConversations() { /* no-op — sidebar est statique */ }

async function loadMessages(restaurantId) {
  const area = document.getElementById('messages-area');
  area.innerHTML = '<div class="chat-empty"><div class="chat-empty-icon"><span data-icon="timer"></span></div><div class="chat-empty-text">Chargement...</div></div>';
  try {
    const res = await fetch(`/messages/${restaurantId}`);
    if(res.ok) { allMsgs = await res.json(); }
    else throw new Error(res.status);
  } catch(e) {
    // Fallback: localStorage per conversation
    const lsKey = 'msgs_admin_' + restaurantId;
    try { allMsgs = JSON.parse(localStorage.getItem(lsKey)||'[]'); } catch(e2) { allMsgs = []; }
  }
  const subEl = document.getElementById('chat-sub');
  if (subEl) subEl.textContent = `${allMsgs.length} message${allMsgs.length>1?'s':''}`;
  renderMessages();
  scrollToBottom();
}

function renderMessages() {
  const area = document.getElementById('messages-area');
  if (!allMsgs.length) {
    area.innerHTML = '<div class="chat-empty"><div class="chat-empty-icon"><span data-icon="chat_bubble"></span></div><div class="chat-empty-text">Aucun message.<br>Commencez la conversation !</div></div>';
    return;
  }

  let html = '';
  let lastDate = '';
  allMsgs.forEach(msg => {
    const d = new Date(msg.timestamp).toDateString();
    if (d !== lastDate) {
      html += `<div class="date-sep">${fmtDate(msg.timestamp)}</div>`;
      lastDate = d;
    }
    const fromAdmin  = msg.from === 'admin';
    const fromSystem = msg.from === 'system';
    const isRestock  = msg.type === 'restock_alert';
    const isMe       = isAdmin ? fromAdmin : !fromAdmin;
    const rowClass   = isMe ? 'from-admin' : fromSystem ? 'from-system' : 'from-restaurant';
    const avatarClass= fromAdmin ? 'admin' : fromSystem ? 'system' : 'restaurant';
    const avatarLabel= fromAdmin ? ini(currentUser.nom||'AD') : fromSystem ? '⚙' : ini(msg.fromName||'?');
    const isRead     = msg.readBy?.length > 0;

    let contentHTML = '';
    if (isRestock && msg.meta?.items) {
      contentHTML = `<div style="margin-bottom:6px;font-weight:600">${msg.content.split(':')[0]} :</div>
        <div class="restock-card">${msg.meta.items.map(i => `
          <div class="restock-item-line">
            <span class="restock-urgency ${i.urgency||'attention'}"></span>
            <strong>${i.nom}</strong> — ${i.quantiteActuelle} ${i.unite} · besoin: ${i.weeklyNeed}/sem
          </div>`).join('')}
        </div>`;
    } else {
      contentHTML = msg.content.replace(/\n/g,'<br>');
    }

    html += `<div class="msg-row ${rowClass}" id="msg-${msg.id}">
      <div class="msg-avatar ${avatarClass}">${avatarLabel}</div>
      <div class="msg-bubble">
        <div class="msg-content ${isRestock?'restock':fromSystem?'system':''}">${contentHTML}</div>
        <div class="msg-meta">
          <span>${msg.fromName||'—'} · ${fmtTime(msg.timestamp)}</span>
          ${isMe ? `<span class="msg-read">${isRead?'✓✓':'✓'}</span>` : ''}
          ${isAdmin ? `<button class="msg-dismiss-btn" onclick="dismissMsg('${msg.id}')" title="Supprimer">✕</button>` : ''}
        </div>
      </div>
    </div>`;
  });
  area.innerHTML = html;
}

function scrollToBottom() {
  const area = document.getElementById('messages-area');
  setTimeout(() => { area.scrollTop = area.scrollHeight; }, 50);
}

// ── ENVOYER UN MESSAGE ──
async function sendMessage() {
  const input = document.getElementById('chat-input');
  const content = input.value.trim();
  if (!content || !activeRid) return;
  input.value = '';
  input.style.height = 'auto';

  const from = isAdmin ? 'admin' : 'restaurant';
  const fromName = isAdmin ? (currentUser.nom || 'Admin') : (currentUser.restaurant || currentUser.nom || 'Restaurant');

  const newMsg = { id: Date.now()+'_'+Math.random().toString(36).slice(2), from, fromName, content, type:'message', timestamp: new Date().toISOString(), readBy:[] };

  try {
    await fetch(`/messages/${activeRid}`, {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ from, fromName, content, type: 'message' })
    });
  } catch(e) {
    // Fallback: save to localStorage
    const lsKey = 'msgs_admin_' + activeRid;
    let msgs = [];
    try { msgs = JSON.parse(localStorage.getItem(lsKey)||'[]'); } catch(e2) {}
    msgs.push(newMsg);
    localStorage.setItem(lsKey, JSON.stringify(msgs));
    allMsgs.push(newMsg);
    renderMessages();
    scrollToBottom();
    return;
  }

  await loadMessages(activeRid);
  await loadAllConversations();
  scrollToBottom();
}

function onChatKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  // Auto-resize
  const t = e.target;
  t.style.height = 'auto';
  t.style.height = Math.min(t.scrollHeight, 120) + 'px';
}

// ── SUPPRIMER UN MESSAGE ──
async function dismissMsg(msgId) {
  if (!confirm('Supprimer ce message ?')) return;
  await fetch(`/messages/${activeRid}/${msgId}`, { method: 'DELETE' });
  allMsgs = allMsgs.filter(m => m.id !== msgId);
  renderMessages();
}

// ── MARQUER TOUT LU ──
async function markAllRead(restaurantId) {
  await fetch(`/messages/${restaurantId}/read-all`, {
    method: 'PATCH', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ by: isAdmin ? 'admin' : rid })
  });
  await loadMessages(restaurantId);
  setBadge('admin-badge', 0);
}

// ── RESTOCK ──
async function loadRestockRecs(restaurantId, forceOpen = false) {
  const res = await fetch(`/restock-recommendations/${restaurantId}?days=14`);
  const data = await res.json();
  restockData[restaurantId] = data.recommendations || [];

  if (activeRid === restaurantId) {
    renderRestockSidebar(restaurantId, data);
  }
  if (forceOpen) openRestockPanel(restaurantId, encodeURIComponent(allRestaurants.find(r=>r.id===restaurantId)?.nom||restaurantId));
}

function renderRestockSidebar(restaurantId, data) {
  const el = document.getElementById('sr-restock');
  const recs = data.recommendations || [];
  if (!recs.length) {
    el.innerHTML = '<div style="font-size:12px;color:#4D6260;padding:4px 0"><span data-icon="check_circle"></span> Aucune recommandation de réapprovisionnement pour cette période.</div>';
    return;
  }
  el.innerHTML = `<div style="font-size:11px;color:#4D6260;margin-bottom:8px">Basé sur ${data.totalOrders} commandes (${data.period}j)</div>` +
    recs.map(r => `
      <div class="restock-rec ${r.urgency}">
        <div class="restock-nom"><span class="urgency-dot ${r.urgency}"></span>${r.nom}</div>
        <div class="restock-detail">
          Stock: <strong>${r.quantiteActuelle} ${r.unite}</strong>
          ${r.daysRemaining !== null ? ` · <strong>${r.daysRemaining}j</strong> restants` : ''}
          · Conso: ${r.avgPerDay}/j · Besoin sem: <strong>${r.weeklyNeed}</strong>
        </div>
        ${isAdmin ? `<button class="restock-send-btn" onclick="sendSingleRestockAlert('${restaurantId}','${r.nom}')"><span data-icon="mail"></span> Envoyer alerte</button>` : ''}
      </div>`).join('');
}

function openRestockPanel(restaurantId, nomEnc) {
  // Redirige vers la conv auto avec ce restaurant sélectionné
  openAutoConv();
}

async function sendRestockAlert(restaurantId) {
  const recs = restockData[restaurantId] || [];
  if (!recs.length) { alert('Aucune recommandation à envoyer pour ce restaurant.'); return; }
  const critiques = recs.filter(r => ['critique','urgent'].includes(r.urgency));
  const items = critiques.length ? critiques : recs.slice(0,3);
  const res = await fetch(`/admin/restock-alert/${restaurantId}`, {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ items, author: currentUser.nom || 'Admin' })
  });
  if (res.ok) { alert('<span data-icon="check_circle"></span> Alerte réapprovisionnement envoyée !'); await loadMessages(restaurantId); }
}

async function sendSingleRestockAlert(restaurantId, nomIngredient) {
  const recs = restockData[restaurantId] || [];
  const item = recs.find(r => r.nom === nomIngredient);
  if (!item) return;
  await fetch(`/admin/restock-alert/${restaurantId}`, {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ items: [item], author: currentUser.nom || 'Admin' })
  });
  await loadMessages(restaurantId);
  alert(`<span data-icon="check_circle"></span> Alerte envoyée pour : ${nomIngredient}`);
}

// ── BROADCASTS ──
let bcList = [], bcUnread = 0;
const bcIcons = { info:'<span data-icon="info"></span>', warn:'<span data-icon="alert"></span>', success:'<span data-icon="check_circle"></span>', danger:'<span data-icon="circle_dot"></span>' };

function timeAgoBc(iso) {
  const diff = Date.now() - new Date(iso);
  if (diff < 60000) return 'À l\'instant';
  if (diff < 3600000) return 'Il y a ' + Math.floor(diff/60000) + 'min';
  return new Date(iso).toLocaleDateString('fr-FR');
}

async function loadBroadcasts() {
  const url = '/admin/broadcast' + (isAdmin ? '' : `?restaurantId=${rid}`);
  const res = await fetch(url);
  bcList = await res.json();
  const lastSeen = parseInt(localStorage.getItem('bcLastSeen')||'0');
  bcUnread = bcList.filter(b => new Date(b.createdAt).getTime() > lastSeen).length;
  updateBcBadge(); renderBcPanel();
}

function renderBcPanel() {
  const el = document.getElementById('bc-panel-list');
  if (!bcList.length) { el.innerHTML = '<div class="bc-panel-empty">Aucun message.</div>'; return; }
  el.innerHTML = bcList.map(b => `
    <div class="bc-notif-item" id="bc-${b.id}">
      <div class="bc-notif-dot ${b.type||'info'}"></div>
      <div style="flex:1">
        <div class="bc-notif-msg">${b.message}</div>
        <div class="bc-notif-time">De ${b.author||'Admin'} · ${timeAgoBc(b.createdAt)}</div>
      </div>
      <button class="bc-dismiss-btn" onclick="dismissBroadcast('${b.id}')" title="Supprimer"><span data-icon="x"></span></button>
    </div>`).join('');
}

function updateBcBadge() {
  const badge = document.getElementById('bc-badge');
  if (bcUnread > 0) { badge.textContent = bcUnread>9?'9+':bcUnread; badge.classList.add('show'); }
  else { badge.classList.remove('show'); }
}

function toggleBcPanel() {
  const panel = document.getElementById('bc-panel');
  panel.classList.toggle('open');
  if (panel.classList.contains('open')) { bcUnread=0; updateBcBadge(); localStorage.setItem('bcLastSeen', Date.now()); }
}

async function dismissBroadcast(id) {
  if (!isAdmin) {
    await fetch(`/admin/broadcast/${id}/dismiss`, { method:'PATCH', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ restaurantId: rid }) });
  } else {
    await fetch(`/admin/broadcast/${id}`, { method:'DELETE' });
  }
  bcList = bcList.filter(b => b.id !== id);
  renderBcPanel();
  updateBcBadge();
  const el = document.getElementById('bc-' + id);
  if (el) el.remove();
}

document.addEventListener('click', e => {
  const panel = document.getElementById('bc-panel');
  if (!e.target.closest('.bc-bell-btn') && panel.classList.contains('open') && !panel.contains(e.target)) {
    panel.classList.remove('open'); bcUnread=0; updateBcBadge(); localStorage.setItem('bcLastSeen', Date.now());
  }
});

// ── SOCKET ADMIN MESSAGES ──
socket.on('admin_new_msg', ({ restaurantId, msg }) => {
  if (isAdmin) {
    if (activeRid === restaurantId && activeConvType === 'admin') {
      allMsgs.push(msg); renderMessages(); scrollToBottom();
    } else {
      // Badge non-lu sur la conv admin
      const badge = document.getElementById('admin-badge');
      if (badge) {
        const n = (parseInt(badge.textContent)||0) + 1;
        setBadge('admin-badge', n);
      }
    }
  }
});

socket.on('broadcast', b => {
  bcList.unshift(b); bcUnread++;
  updateBcBadge(); renderBcPanel();
});

// ── RESTOCK AUTOMATIQUE pour restaurants ──
// Si des alertes existent, affiche un badge sur la conv automatique
async function checkRestockForRestaurant() {
  if (isAdmin) return;
  try {
    const res = await fetch(`/restock-recommendations/${rid}?days=14`);
    if (!res.ok) return;
    const data = await res.json();
    const critiques = (data.recommendations||[]).filter(r => r.urgency === 'critique' || r.urgency === 'urgent');
    if (critiques.length > 0) setBadge('auto-badge', critiques.length);
  } catch(e) {}
}

// ── START ──
init();
if (!isAdmin) checkRestockForRestaurant();
</script>
