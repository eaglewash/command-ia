<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Détection Fraude — Commande-IA</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:#EEF5F2;min-height:100vh;color:#111}
.topbar{background:#0E4B47;display:flex;align-items:center;justify-content:space-between;padding:0 28px;height:64px;position:sticky;top:0;z-index:100}
.tl{display:flex;align-items:center;gap:14px}
.logo{font-size:16px;font-weight:700;color:#fff;display:flex;align-items:center;gap:9px}
.logo-icon{width:30px;height:30px;border-radius:8px;background:#0E4B47;display:flex;align-items:center;justify-content:center}
.logo-icon svg{width:14px;height:14px}
.page-badge{font-size:9px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;background:rgba(123,187,181,.15);color:#B8D0C8;padding:3px 9px;border-radius:5px;border:1px solid rgba(123,187,181,.25)}
.tr{display:flex;align-items:center;gap:10px}
.back-btn{font-size:12px;font-weight:600;color:#B8D0C8;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);padding:6px 14px;border-radius:7px;cursor:pointer;text-decoration:none;transition:all .15s;font-family:'Inter',sans-serif}
.back-btn:hover{background:rgba(255,255,255,.15);color:#fff}
.btn-secondary{font-size:12px;font-weight:600;color:#B8D0C8;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);padding:6px 14px;border-radius:7px;cursor:pointer;text-decoration:none;transition:all .15s;font-family:'Inter',sans-serif}
.btn-secondary:hover{background:rgba(255,255,255,.15);color:#fff}
.main{padding:24px 28px;max-width:1400px;margin:0 auto}
.page-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px}
.page-title{font-size:22px;font-weight:800;color:#0F2A28;letter-spacing:-.5px}
.page-sub{font-size:13px;color:#4D6260;margin-top:4px}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.select-std{font-size:12px;padding:8px 12px;border-radius:8px;border:1.5px solid #B8D0C8;font-family:'Inter',sans-serif;color:#0F2A28;background:#fff;cursor:pointer}
.btn-primary{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;padding:9px 18px;border-radius:9px;border:none;background:#0E4B47;color:#fff;cursor:pointer;font-family:'Inter',sans-serif;transition:all .15s}
.btn-primary:hover{background:#0A3D3A}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.kpi{background:#fff;border:1.5px solid #B8D0C8;border-radius:14px;padding:16px;position:relative;overflow:hidden;transition:all .15s}
.kpi:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.06)}
.kpi::after{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.kpi.green::after{background:linear-gradient(90deg,#0E4B47,#7BBBB5)}
.kpi.red::after{background:linear-gradient(90deg,#c03030,#e07070)}
.kpi.orange::after{background:linear-gradient(90deg,#e08a10,#f0c040)}
.kpi.blue::after{background:linear-gradient(90deg,#2a50aa,#70a0f0)}
.kpi-icon{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;margin-bottom:8px}
.kpi-val{font-size:26px;font-weight:800;color:#0F2A28;letter-spacing:-.6px}
.kpi-lbl{font-size:10px;font-weight:700;color:#4D6260;text-transform:uppercase;letter-spacing:.8px;margin-top:4px}
.kpi-sub{font-size:11px;color:#b0c8b0;margin-top:2px}
.layout{display:grid;grid-template-columns:1fr 360px;gap:16px;align-items:start}
.card{background:#fff;border:1.5px solid #B8D0C8;border-radius:14px;padding:20px}
.card-title{font-size:13px;font-weight:700;color:#0F2A28;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between}
table{width:100%;border-collapse:collapse}
thead tr{background:#f8fbf5}
th{font-size:10px;font-weight:700;color:#4D6260;text-transform:uppercase;letter-spacing:.8px;padding:10px 14px;text-align:left;border-bottom:1.5px solid #B8D0C8;white-space:nowrap}
td{font-size:12px;color:#3a5a3a;padding:11px 14px;border-bottom:1px solid #f0f6ee;vertical-align:middle}
tbody tr:hover td{background:#fafdf7}
.badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:6px;display:inline-block}
.bg{background:#DCF0ED;color:#0E4B47}
.bo{background:#fff8e8;color:#906010}
.br{background:#fef0f0;color:#b03030}
.alert-list{display:flex;flex-direction:column;gap:8px}
.alert-item{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border-radius:10px;border:1.5px solid transparent;transition:all .15s}
.alert-item.high{background:#fef0f0;border-color:#f0c0c0}
.alert-item.medium{background:#fff8e8;border-color:#e8d080}
.alert-item.low{background:#f8fbf5;border-color:#B8D0C8}
.alert-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.alert-icon.high{background:#fde0e0}
.alert-icon.medium{background:#fff0c0}
.alert-icon.low{background:#DCF0ED}
.alert-text{font-size:12px;font-weight:600;color:#0F2A28;flex:1;line-height:1.4}
.alert-meta{font-size:10px;color:#8aaa8a;margin-top:2px}
.chart-wrap{position:relative;height:220px}
.threshold-row{display:flex;align-items:center;gap:12px;margin-bottom:12px;padding:10px 14px;background:#f8fbf5;border-radius:8px}
.threshold-lbl{font-size:12px;font-weight:600;color:#0F2A28;flex:1}
.threshold-val{font-size:12px;font-weight:700;color:#0E4B47;min-width:36px;text-align:right}
input[type=range]{flex:1;accent-color:#0E4B47}
.tab-bar{display:flex;gap:6px;margin-bottom:16px}
.tab{font-size:12px;font-weight:600;padding:6px 14px;border-radius:20px;border:1.5px solid #B8D0C8;background:#fff;color:#4D6260;cursor:pointer;transition:all .15s;font-family:'Inter',sans-serif}
.tab.active{background:#0E4B47;color:#B8D0C8;border-color:#0E4B47}
/* Loading / empty / error */
.state-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;gap:12px;text-align:center}
.state-icon{font-size:40px;opacity:.5}
.state-title{font-size:15px;font-weight:700;color:#0F2A28}
.state-sub{font-size:12px;color:#8aaa8a;max-width:300px}
.spinner{width:32px;height:32px;border:3px solid #B8D0C8;border-top-color:#0E4B47;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.error-banner{background:#fef0f0;border:1.5px solid #f0c0c0;border-radius:10px;padding:14px 18px;font-size:12px;color:#b03030;font-weight:600;margin-bottom:16px;display:flex;align-items:center;gap:10px}
.risk-bar-wrap{display:flex;align-items:center;gap:6px}
.risk-bar{height:6px;width:70px;background:#B8D0C8;border-radius:3px;overflow:hidden;flex-shrink:0}
.risk-fill{height:100%;border-radius:3px}
.risk-num{font-size:12px;font-weight:700;min-width:22px}
.info-note{background:#f0f6ff;border:1.5px solid #c0d8f0;border-radius:10px;padding:12px 16px;font-size:12px;color:#3060a0;margin-bottom:16px;line-height:1.5}
#toast-container{position:fixed;bottom:24px;right:24px;z-index:9999;display:flex;flex-direction:column;gap:8px}
.toast{background:#fff;border:1px solid #B8D0C8;border-radius:10px;padding:12px 16px;font-size:12px;font-weight:600;color:#333;box-shadow:0 6px 20px rgba(0,0,0,.1);animation:ti .25s ease}
@keyframes ti{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  </style>
<script src="/icons.js"></script>

<link rel=stylesheet href=/css/common.css>
  <link rel="stylesheet" href="/css/theme.css">
</head>
<body>
<div class="topbar">
  <div class="tl">
    <div class="logo"><div class="logo-icon"><svg viewBox="0 0 14 14" fill="none"><path d="M2 7h10M7 2v10" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg></div>Commande-IA</div>
    <span class="page-badge">Détection Fraude</span>
  </div>
  <div class="tr">
    <button class="btn-secondary" onclick="exportAlerts()" id="export-btn" style="display:none">Exporter alertes</button>
    <a href="/index.html" class="back-btn">← Dashboard</a>
  </div>
</div>

<div class="main">
  <div class="page-header">
    <div>
      <div class="page-title">Détection Fraude & Anomalies</div>
      <div class="page-sub">Analyse automatique des comportements suspects basée sur les commandes réelles archivées de votre restaurant</div>
    </div>
    <div class="actions" id="header-actions">
      <!-- Sélecteur restaurant admin injecté ici -->
      <select class="select-std" id="period-sel" onchange="loadData()">
        <option value="7">7 derniers jours</option>
        <option value="14">14 jours</option>
        <option value="30">30 jours</option>
      </select>
    </div>
  </div>

  <div id="error-zone"></div>
  <div id="content-zone"></div>
</div>

<div id="toast-container"></div>

<script>
const ORIGIN = window.location.origin;
const user = JSON.parse(sessionStorage.getItem('user') || '{}');
if (!user.email) window.location.href = '/login.html';
const isAdmin = user.role === 'Admin';
let currentRestaurantId = user.restaurantId || null;

// Thresholds (local settings)
let THR = { cancelRate: 8, discountRate: 5, freeAmount: 30 };

// Loaded data
let analyticsData = null;
let archiveOrders = [];
let allDates = [];
let employeeMap = {};
let mainChart = null;

// ─── INIT ────────────────────────────────────────────────
async function init() {
  if (isAdmin) {
    try {
      const r = await fetch(ORIGIN + '/admin/restaurants');
      if (!r.ok) throw new Error();
      const restos = await r.json();
      if (!restos.length) {
        renderEmpty('Aucun restaurant', 'Créez un restaurant pour commencer l\'analyse.');
        return;
      }
      const sel = document.createElement('select');
      sel.className = 'select-std';
      sel.id = 'resto-sel';
      sel.innerHTML = restos.map(r => `<option value="${r.id}">${r.nom}</option>`).join('');
      currentRestaurantId = restos[0].id;
      sel.onchange = () => { currentRestaurantId = sel.value; loadData(); };
      document.getElementById('header-actions').prepend(sel);
    } catch {
      showError('Impossible de charger la liste des restaurants.');
      return;
    }
  }
  if (currentRestaurantId) {
    await loadData();
  } else {
    renderEmpty('Aucun restaurant associé', 'Votre compte n\'est pas lié à un restaurant.');
  }

  // ── Synchro temps réel : si un employé est ajouté / modifié, on recharge ──
  setupFraudLiveSync();
}

function setupFraudLiveSync() {
  if (typeof io !== 'function' || window._fraudSyncDone) return;
  window._fraudSyncDone = true;
  try {
    const sock = io();
    let _last = 0;
    sock.on('employes-updated', () => {
      const now = Date.now();
      if (now - _last < 400) return;
      _last = now;
      if (currentRestaurantId) loadData();
    });
  } catch (e) { console.warn('Socket fraude indisponible :', e.message); }
}

// ─── LOAD DATA ───────────────────────────────────────────
async function loadData() {
  const days = parseInt(document.getElementById('period-sel').value);
  showLoading();
  clearError();

  try {
    // Fetch analytics + archive dates in parallel
    const [aRes, dRes] = await Promise.all([
      fetch(`${ORIGIN}/analytics?restaurantId=${currentRestaurantId}&days=${days}`),
      fetch(`${ORIGIN}/archives/dates?restaurantId=${currentRestaurantId}`)
    ]);

    if (!aRes.ok) throw new Error('analytics');
    analyticsData = await aRes.json();

    allDates = dRes.ok ? await dRes.json() : [];

    // Fetch recent archive orders (up to last 7 dates max for analysis)
    archiveOrders = [];
    const recentDates = allDates.slice(-Math.min(7, allDates.length));
    if (recentDates.length > 0) {
      const fetchedArchives = await Promise.all(
        recentDates.map(d =>
          fetch(`${ORIGIN}/archives?restaurantId=${currentRestaurantId}&date=${d}`)
            .then(r => r.ok ? r.json() : [])
            .catch(() => [])
        )
      );
      archiveOrders = fetchedArchives.flat();
    }

    // Also fetch employees for cross-reference
    if (isAdmin || user.role === 'Manager') {
      try {
        const eRes = await fetch(ORIGIN + '/admin/employes');
        if (eRes.ok) {
          const all = await eRes.json();
          const filtered = all.filter(e => e.restaurantId === currentRestaurantId);
          filtered.forEach(e => { employeeMap[e.nom] = e; });
        }
      } catch { /* non bloquant */ }
    }

    renderAll(days);
  } catch (e) {
    showError('Erreur lors du chargement des données. ' + (e.message || ''));
  }
}

// ─── ANALYSE ─────────────────────────────────────────────
function analyzeOrders() {
  // Build per-serveur stats from archive orders
  const stats = {};

  archiveOrders.forEach(order => {
    const key = order.serveur || order.waiter || order.employe || null;
    if (!key) return;
    if (!stats[key]) stats[key] = { name: key, total: 0, refused: 0, discounted: 0, discountTotal: 0, freeItems: 0 };
    stats[key].total++;
    if (order.statut === 'refuse' || order.statut === 'annule' || order.statut === 'refusé' || order.statut === 'annulé') {
      stats[key].refused++;
    }
    const remise = parseFloat(order.remise || order.discount || 0);
    if (remise > 0) { stats[key].discounted++; stats[key].discountTotal += remise; }
    if (order.offert || order.gratuit || order.free) stats[key].freeItems++;
  });

  return Object.values(stats).map(s => {
    const cancelRate = s.total > 0 ? (s.refused / s.total) * 100 : 0;
    const discountRate = s.total > 0 ? (s.discounted / s.total) * 100 : 0;
    let score = 0;
    if (cancelRate > THR.cancelRate) score += 4 * (cancelRate / THR.cancelRate);
    if (discountRate > THR.discountRate) score += 3 * (discountRate / THR.discountRate);
    if (s.discountTotal > THR.freeAmount) score += 3 * (s.discountTotal / THR.freeAmount);
    score = Math.min(10, parseFloat(score.toFixed(1)));
    return { ...s, cancelRate: parseFloat(cancelRate.toFixed(1)), discountRate: parseFloat(discountRate.toFixed(1)), score };
  }).sort((a, b) => b.score - a.score);
}

function buildAlerts(staffStats) {
  const alerts = [];
  const totalOrders = analyticsData.totalOrders || 0;
  const refusedOrders = analyticsData.refusedOrders || 0;

  // Alerte taux de refus global
  if (totalOrders > 0) {
    const globalRefuseRate = (refusedOrders / totalOrders) * 100;
    if (globalRefuseRate > THR.cancelRate) {
      alerts.push({
        level: 'high', icon: '<span data-icon="alert_octagon"></span>',
        text: `Taux de refus global élevé : ${globalRefuseRate.toFixed(1)}% (seuil : ${THR.cancelRate}%)`,
        meta: `${refusedOrders} commandes refusées sur ${totalOrders} au total`
      });
    }
  }

  // Alertes par employé
  staffStats.forEach(s => {
    if (s.cancelRate > THR.cancelRate * 1.5) {
      alerts.push({
        level: 'high', icon: '<span data-icon="alert_octagon"></span>',
        text: `${s.name} — taux d'annulation très élevé : ${s.cancelRate}%`,
        meta: `${s.refused} annulations sur ${s.total} commandes`
      });
    } else if (s.cancelRate > THR.cancelRate) {
      alerts.push({
        level: 'medium', icon: '<span data-icon="alert"></span>',
        text: `${s.name} — taux d'annulation au-dessus du seuil : ${s.cancelRate}%`,
        meta: `Seuil configuré : ${THR.cancelRate}%`
      });
    }
    if (s.discountRate > THR.discountRate) {
      alerts.push({
        level: s.discountRate > THR.discountRate * 2 ? 'high' : 'medium',
        icon: s.discountRate > THR.discountRate * 2 ? '<span data-icon="alert_octagon"></span>' : '<span data-icon="alert"></span>',
        text: `${s.name} — taux de remises suspect : ${s.discountRate}%`,
        meta: `Total des remises : ${s.discountTotal.toFixed(2)}€`
      });
    }
  });

  // Alerte si CA très faible (possible sous-déclaration)
  const avgDay = analyticsData.totalRevenue / (analyticsData.ordersByDay?.length || 1);
  if (analyticsData.revenueByDay) {
    analyticsData.revenueByDay.forEach((v, i) => {
      if (v > 0 && v < avgDay * 0.3) {
        alerts.push({
          level: 'low', icon: '<span data-icon="info"></span>',
          text: `CA anormalement bas un jour (${v.toFixed(2)}€ vs moy. ${avgDay.toFixed(2)}€)`,
          meta: 'Possible sous-déclaration ou problème de saisie'
        });
      }
    });
  }

  return alerts.slice(0, 10);
}

// ─── RENDER ──────────────────────────────────────────────
function renderAll(days) {
  if (!analyticsData) return;

  const staffStats = analyzeOrders();
  const alerts = buildAlerts(staffStats);
  const hasEmployeeData = staffStats.length > 0;

  const totalOrders = analyticsData.totalOrders || 0;
  const refusedOrders = analyticsData.refusedOrders || 0;
  const refuseRate = totalOrders > 0 ? ((refusedOrders / totalOrders) * 100).toFixed(1) : '0';
  const isHighRefuse = parseFloat(refuseRate) > THR.cancelRate;
  const highAlerts = alerts.filter(a => a.level === 'high').length;

  document.getElementById('content-zone').innerHTML = `
    <div class="kpi-grid">
      <div class="kpi ${isHighRefuse ? 'red' : 'green'}">
        <div class="kpi-icon" style="background:${isHighRefuse ? '#fef0f0' : '#DCF0ED'}">
          <svg viewBox="0 0 20 20" fill="none" width="18" height="18"><path d="M10 2l1.5 4.5L16 8l-3.5 3.4.8 4.8L10 14l-3.3 2.2.8-4.8L4 8l4.5-1.5z" stroke="${isHighRefuse ? '#c03030' : '#0E4B47'}" stroke-width="1.5"/></svg>
        </div>
        <div class="kpi-val" style="color:${isHighRefuse ? '#c03030' : '#0F2A28'}">${refuseRate}%</div>
        <div class="kpi-lbl">Taux refus/annulation</div>
        <div class="kpi-sub">${refusedOrders} refusées / ${totalOrders} total</div>
      </div>
      <div class="kpi ${highAlerts > 0 ? 'red' : 'green'}">
        <div class="kpi-icon" style="background:${highAlerts > 0 ? '#fef0f0' : '#DCF0ED'}">
          <svg viewBox="0 0 20 20" fill="none" width="18" height="18"><path d="M10 2v8m0 4v.01" stroke="${highAlerts > 0 ? '#c03030' : '#0E4B47'}" stroke-width="2" stroke-linecap="round"/><circle cx="10" cy="10" r="8" stroke="${highAlerts > 0 ? '#c03030' : '#0E4B47'}" stroke-width="1.5"/></svg>
        </div>
        <div class="kpi-val" style="color:${highAlerts > 0 ? '#c03030' : '#0F2A28'}">${alerts.length}</div>
        <div class="kpi-lbl">Alertes générées</div>
        <div class="kpi-sub">${highAlerts} critique${highAlerts > 1 ? 's' : ''}</div>
      </div>
      <div class="kpi blue">
        <div class="kpi-icon" style="background:#e8f0ff">
          <svg viewBox="0 0 20 20" fill="none" width="18" height="18"><path d="M4 10h12M10 4v12" stroke="#2a50aa" stroke-width="1.5" stroke-linecap="round"/></svg>
        </div>
        <div class="kpi-val">${archiveOrders.length}</div>
        <div class="kpi-lbl">Commandes analysées</div>
        <div class="kpi-sub">${allDates.length > 0 ? allDates.length + ' jours d\'archives' : 'Aucune archive'}</div>
      </div>
      <div class="kpi ${hasEmployeeData ? 'orange' : 'green'}">
        <div class="kpi-icon" style="background:${hasEmployeeData ? '#fff8e8' : '#DCF0ED'}">
          <svg viewBox="0 0 20 20" fill="none" width="18" height="18"><circle cx="8" cy="7" r="3" stroke="${hasEmployeeData ? '#e08a10' : '#0E4B47'}" stroke-width="1.5"/><path d="M3 17c0-3 2.2-5 5-5s5 2 5 5" stroke="${hasEmployeeData ? '#e08a10' : '#0E4B47'}" stroke-width="1.5" stroke-linecap="round"/></svg>
        </div>
        <div class="kpi-val">${staffStats.length}</div>
        <div class="kpi-lbl">Serveurs analysés</div>
        <div class="kpi-sub">${staffStats.filter(s => s.score >= 4).length} au-dessus du seuil</div>
      </div>
    </div>

    ${!hasEmployeeData && archiveOrders.length === 0 ? `
    <div class="info-note">
      <span data-icon="info"></span> <strong>Données insuffisantes pour l'analyse comportementale.</strong>
      Les données de commandes ne contiennent pas encore d'information par serveur. L'analyse s'appuie sur les métriques globales disponibles via les analytics.
    </div>` : ''}

    <div class="layout">
      <div style="display:flex;flex-direction:column;gap:16px">
        ${hasEmployeeData ? `
        <div class="card">
          <div class="card-title">Analyse par serveur <span style="font-size:11px;font-weight:500;color:#8aaa8a">Basé sur ${archiveOrders.length} commandes analysées</span></div>
          <table>
            <thead><tr><th>Serveur</th><th>Commandes</th><th>Annulations</th><th>Remises</th><th>Score risque</th><th>Statut</th></tr></thead>
            <tbody id="staff-table">
              ${staffStats.map(s => {
                const c = s.score >= 7 ? '#c03030' : s.score >= 4 ? '#e08a10' : '#0E4B47';
                const bg = s.score >= 7 ? '#fef0f0' : s.score >= 4 ? '#fff8e8' : '#DCF0ED';
                const lbl = s.score >= 7 ? 'Élevé' : s.score >= 4 ? 'Modéré' : 'Faible';
                const fill = Math.round(s.score / 10 * 100);
                return `<tr>
                  <td><strong style="color:#0F2A28">${s.name}</strong></td>
                  <td>${s.total}</td>
                  <td style="color:${s.cancelRate > THR.cancelRate ? '#c03030' : '#0E4B47'};font-weight:600">${s.cancelRate}%</td>
                  <td style="color:${s.discountRate > THR.discountRate ? '#c03030' : '#0E4B47'};font-weight:600">${s.discountRate}%</td>
                  <td><div class="risk-bar-wrap"><div class="risk-bar"><div class="risk-fill" style="width:${fill}%;background:${c}"></div></div><span class="risk-num" style="color:${c}">${s.score}</span></div></td>
                  <td><span class="badge" style="background:${bg};color:${c}">${lbl}</span></td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>
        </div>` : ''}

        <div class="card">
          <div class="card-title">Évolution des commandes refusées</div>
          <div class="tab-bar">
            <button class="tab active" onclick="switchTab('refuse',this)" id="tab-refuse">Refus/jour</button>
            <button class="tab" onclick="switchTab('ratio',this)" id="tab-ratio">Ratio refus %</button>
          </div>
          <div class="chart-wrap"><canvas id="main-chart"></canvas></div>
        </div>
      </div>

      <div style="display:flex;flex-direction:column;gap:14px">
        <div class="card">
          <div class="card-title">
            Alertes
            <span class="badge ${alerts.filter(a=>a.level==='high').length > 0 ? 'br' : 'bg'}">${alerts.filter(a=>a.level==='high').length} critique${alerts.filter(a=>a.level==='high').length > 1 ? 's' : ''}</span>
          </div>
          ${alerts.length === 0 ? `
          <div class="state-wrap" style="padding:24px 0">
            <div class="state-icon"><span data-icon="check_circle"></span></div>
            <div class="state-title" style="font-size:13px">Aucune anomalie détectée</div>
            <div class="state-sub" style="font-size:11px">Tous les indicateurs sont dans les seuils configurés.</div>
          </div>` : `
          <div class="alert-list">
            ${alerts.map(a => `
            <div class="alert-item ${a.level}">
              <div class="alert-icon ${a.level}">${a.icon}</div>
              <div style="flex:1">
                <div class="alert-text">${a.text}</div>
                <div class="alert-meta">${a.meta}</div>
              </div>
            </div>`).join('')}
          </div>`}
        </div>

        <div class="card">
          <div class="card-title">Seuils de détection</div>
          <div class="threshold-row">
            <span class="threshold-lbl">Seuil annulations (%)</span>
            <input type="range" min="1" max="20" value="${THR.cancelRate}" id="thr-cancel"
              oninput="document.getElementById('tv-cancel').textContent=this.value+'%'">
            <span class="threshold-val" id="tv-cancel">${THR.cancelRate}%</span>
          </div>
          <div class="threshold-row">
            <span class="threshold-lbl">Seuil remises (%)</span>
            <input type="range" min="1" max="20" value="${THR.discountRate}" id="thr-disc"
              oninput="document.getElementById('tv-disc').textContent=this.value+'%'">
            <span class="threshold-val" id="tv-disc">${THR.discountRate}%</span>
          </div>
          <div class="threshold-row">
            <span class="threshold-lbl">Seuil remises totales (€)</span>
            <input type="range" min="5" max="150" value="${THR.freeAmount}" step="5" id="thr-free"
              oninput="document.getElementById('tv-free').textContent=this.value+'€'">
            <span class="threshold-val" id="tv-free">${THR.freeAmount}€</span>
          </div>
          <button class="btn-primary" style="margin-top:10px;width:100%;justify-content:center" onclick="applyThresholds()">
            Recalculer avec ces seuils
          </button>
        </div>

        <div class="card">
          <div class="card-title"><span data-icon="book_open"></span> Guide des métriques</div>
          <div style="display:flex;flex-direction:column;gap:10px;font-size:12px">
            <div style="padding:10px 12px;background:#f0f6ff;border-radius:8px;border-left:3px solid #2a50aa">
              <div style="font-weight:700;color:#0F2A28;margin-bottom:3px">Score de risque (0–10)</div>
              <div style="color:#3060a0;line-height:1.5">Score calculé pour chaque serveur en combinant son taux d'annulations, son taux de remises et le montant total remisé. <strong>0–3</strong> = normal, <strong>4–6</strong> = à surveiller, <strong>7–10</strong> = alerte critique.</div>
            </div>
            <div style="padding:10px 12px;background:#fff8e8;border-radius:8px;border-left:3px solid #e08a10">
              <div style="font-weight:700;color:#0F2A28;margin-bottom:3px">Taux d'annulation (%)</div>
              <div style="color:#7a5010;line-height:1.5">Pourcentage de commandes annulées ou refusées par un serveur sur son total. Un taux élevé peut indiquer des annulations frauduleuses pour corriger une caisse.</div>
            </div>
            <div style="padding:10px 12px;background:#fef0f0;border-radius:8px;border-left:3px solid #c03030">
              <div style="font-weight:700;color:#0F2A28;margin-bottom:3px">Taux de remises (%)</div>
              <div style="color:#903030;line-height:1.5">Pourcentage de commandes auxquelles une remise a été appliquée. Un taux anormalement élevé suggère possiblement des remises non autorisées.</div>
            </div>
            <div style="padding:10px 12px;background:#f8fdf5;border-radius:8px;border-left:3px solid #0E4B47">
              <div style="font-weight:700;color:#0F2A28;margin-bottom:3px">Seuils de détection</div>
              <div style="color:#4D6260;line-height:1.5">Valeurs au-delà desquelles une alerte est générée. Ajustez ces seuils selon votre politique interne. Les seuils sont sauvegardés dans votre navigateur.</div>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-title">Résumé analytique</div>
          <div style="display:flex;flex-direction:column;gap:8px;font-size:12px;color:#3a5a3a">
            <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f0f6ee">
              <span>Total commandes (${days}j)</span>
              <strong>${totalOrders}</strong>
            </div>
            <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f0f6ee">
              <span>Commandes refusées</span>
              <strong style="color:${refusedOrders > 0 ? '#c03030' : '#0E4B47'}">${refusedOrders}</strong>
            </div>
            <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f0f6ee">
              <span>CA total</span>
              <strong>${(analyticsData.totalRevenue || 0).toFixed(2)}€</strong>
            </div>
            <div style="display:flex;justify-content:space-between;padding:8px 0">
              <span>Pannier moyen</span>
              <strong>${(analyticsData.avgOrderValue || 0).toFixed(2)}€</strong>
            </div>
          </div>
        </div>
      </div>
    </div>
  `;

  document.getElementById('export-btn').style.display = alerts.length > 0 ? 'block' : 'none';
  buildChart('refuse');
  window._alerts = alerts;
}

// ─── CHART ───────────────────────────────────────────────
let currentTab = 'refuse';
function buildChart(type) {
  currentTab = type;
  const ctx = document.getElementById('main-chart');
  if (!ctx) return;
  if (mainChart) { mainChart.destroy(); mainChart = null; }

  const labels = analyticsData.revenueByDay?.map((_, i) => `J-${analyticsData.revenueByDay.length - i}`) || [];
  const ordersDay = analyticsData.ordersByDay || [];

  // Estimate refused per day proportionally (we don't have per-day refused data)
  const days = labels.length || 1;
  const totalRefused = analyticsData.refusedOrders || 0;
  const totalOrders = analyticsData.totalOrders || 0;

  let datasetData, label, color, yLabel;
  if (type === 'refuse') {
    // Distribute refused orders proportionally to orders per day
    datasetData = ordersDay.map(d => {
      if (!totalOrders) return 0;
      return parseFloat(((d / totalOrders) * totalRefused).toFixed(1));
    });
    if (!datasetData.length) datasetData = Array(7).fill(0);
    label = 'Commandes refusées/jour (estimé)';
    color = '#e07070';
    yLabel = 'Nb commandes';
  } else {
    datasetData = ordersDay.map(d => {
      if (!d) return 0;
      const estimated = (d / (totalOrders || 1)) * totalRefused;
      return parseFloat(((estimated / d) * 100).toFixed(1));
    });
    if (!datasetData.length) datasetData = Array(7).fill(0);
    label = 'Taux de refus %';
    color = '#c03030';
    yLabel = '%';
  }

  mainChart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: labels.length ? labels : Array(datasetData.length).fill('').map((_, i) => `J-${i+1}`),
      datasets: [{
        label, data: datasetData,
        backgroundColor: datasetData.map(v => v > (type === 'refuse' ? 1 : THR.cancelRate) ? color : 'rgba(14,75,71,.4)'),
        borderRadius: 6, borderSkipped: false
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { labels: { font: { family: 'Inter', size: 11 } } },
        tooltip: { callbacks: { label: ctx => ` ${ctx.parsed.y} ${yLabel}` } }
      },
      scales: {
        y: { beginAtZero: true, grid: { color: 'rgba(0,0,0,.04)' }, ticks: { font: { family: 'Inter', size: 11 } } },
        x: { grid: { display: false }, ticks: { font: { family: 'Inter', size: 11 } } }
      }
    }
  });
}

function switchTab(type, btn) {
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  buildChart(type);
}

function applyThresholds() {
  THR.cancelRate = parseInt(document.getElementById('thr-cancel').value);
  THR.discountRate = parseInt(document.getElementById('thr-disc').value);
  THR.freeAmount = parseInt(document.getElementById('thr-free').value);
  renderAll(parseInt(document.getElementById('period-sel').value));
  toast('Seuils appliqués — analyse recalculée', 'success');
}

// ─── EXPORT ──────────────────────────────────────────────
function exportAlerts() {
  const alerts = window._alerts || [];
  if (!alerts.length) { toast('Aucune alerte à exporter'); return; }
  const rows = 'Niveau,Texte,Détail\n' +
    alerts.map(a => [a.level, '"' + a.text + '"', '"' + a.meta + '"'].join(',')).join('\n');
  const link = document.createElement('a');
  link.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(rows);
  link.download = 'alertes_fraude.csv';
  link.click();
  toast('Export téléchargé', 'success');
}

// ─── UI HELPERS ──────────────────────────────────────────
function showLoading() {
  document.getElementById('content-zone').innerHTML = `
    <div class="state-wrap">
      <div class="spinner"></div>
      <div class="state-title">Analyse des commandes en cours…</div>
      <div class="state-sub">Récupération des archives et calcul des anomalies</div>
    </div>`;
}

function renderEmpty(title, sub) {
  document.getElementById('content-zone').innerHTML = `
    <div class="card"><div class="state-wrap">
      <div class="state-icon"><span data-icon="search"></span></div>
      <div class="state-title">${title}</div>
      <div class="state-sub">${sub}</div>
    </div></div>`;
}

function showError(msg) {
  document.getElementById('error-zone').innerHTML = `
    <div class="error-banner">
      <svg viewBox="0 0 20 20" fill="none" width="18" height="18"><circle cx="10" cy="10" r="8" stroke="#c03030" stroke-width="1.5"/><path d="M10 6v4m0 4v.01" stroke="#c03030" stroke-width="2" stroke-linecap="round"/></svg>
      ${msg}
      <button onclick="loadData()" style="margin-left:auto;font-size:11px;font-weight:600;color:#b03030;background:none;border:none;cursor:pointer;text-decoration:underline">Réessayer</button>
    </div>`;
  document.getElementById('content-zone').innerHTML = '';
}

function clearError() {
  document.getElementById('error-zone').innerHTML = '';
}

function toast(msg, type = 'info') {
  const el = document.createElement('div');
  el.className = 'toast';
  el.style.borderLeft = '3px solid ' + (type === 'success' ? '#0E4B47' : '#c03030');
  el.textContent = msg;
  document.getElementById('toast-container').appendChild(el);
  setTimeout(() => el.remove(), 3500);
}

init();
</script>
