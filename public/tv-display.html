<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Commande-IA — Affichage Salle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  :root{
    --bg:#0c1a0c;
    --bg2:#0f2010;
    --bg3:#142614;
    --green-bright:#4ade80;
    --green-mid:#22c55e;
    --green-soft:#86efac;
    --green-dim:#166534;
    --green-glow:rgba(74,222,128,.18);
    --orange:#fb923c;
    --yellow:#fbbf24;
    --white:#f0fff4;
    --gray:#6b7280;
  }
  body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--white);min-height:100vh;overflow:hidden;display:flex;flex-direction:column;}
  .tv-header{background:linear-gradient(180deg,rgba(20,38,20,.98),rgba(15,32,16,.95));border-bottom:2px solid var(--green-dim);padding:18px 48px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
  .header-logo{display:flex;align-items:center;gap:16px;}
  .logo-icon-tv{background:linear-gradient(135deg,#0E4B47,#22c55e);border-radius:14px;width:56px;height:56px;display:flex;align-items:center;justify-content:center;font-size:30px;box-shadow:0 0 20px rgba(74,222,128,.3);}
  .logo-text-tv{font-size:28px;font-weight:900;color:var(--white);letter-spacing:-1px;}
  .logo-sub-tv{font-size:14px;color:var(--green-soft);font-weight:500;margin-top:2px;}
  .clock-display{text-align:right;}
  .clock-time{font-size:52px;font-weight:900;color:var(--green-bright);letter-spacing:-2px;line-height:1;font-variant-numeric:tabular-nums;}
  .clock-date{font-size:16px;color:var(--green-soft);margin-top:4px;font-weight:500;}
  .tv-body{display:grid;grid-template-columns:1fr 1fr;gap:0;flex:1;overflow:hidden;}
  .section{padding:24px 32px;display:flex;flex-direction:column;overflow:hidden;}
  .section-left{border-right:2px solid var(--green-dim);background:linear-gradient(180deg,var(--bg2),var(--bg));}
  .section-right{background:var(--bg);}
  .section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
  .section-title{font-size:18px;font-weight:800;text-transform:uppercase;letter-spacing:2px;padding:6px 16px;border-radius:6px;}
  .title-ready{background:rgba(74,222,128,.12);color:var(--green-bright);border:1px solid rgba(74,222,128,.25);}
  .title-prep{background:rgba(251,146,60,.1);color:var(--orange);border:1px solid rgba(251,146,60,.2);}
  .section-count{font-size:24px;font-weight:900;padding:4px 16px;border-radius:20px;}
  .count-ready{background:var(--green-bright);color:#052e0f;}
  .count-prep{background:var(--orange);color:#fff;}
  .orders-ready{display:flex;flex-wrap:wrap;gap:14px;flex:1;align-content:flex-start;overflow:hidden;}
  .order-num-big{display:flex;flex-direction:column;align-items:center;justify-content:center;width:150px;height:150px;border-radius:20px;border:3px solid var(--green-mid);background:linear-gradient(135deg,rgba(34,197,94,.12),rgba(74,222,128,.06));cursor:default;position:relative;overflow:hidden;}
  .order-num-big::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 0%,rgba(74,222,128,.15),transparent 70%);}
  .order-num-big.pulse{animation:pulseGreen 2s infinite;}
  .order-num-big.new-anim{animation:popIn .5s cubic-bezier(.26,1.8,.55,1) forwards;}
  @keyframes pulseGreen{0%,100%{box-shadow:0 0 0 0 rgba(74,222,128,.4);}50%{box-shadow:0 0 0 12px rgba(74,222,128,0);}}
  @keyframes popIn{0%{transform:scale(0);opacity:0;}100%{transform:scale(1);opacity:1;}}
  .big-num{font-size:80px;font-weight:900;color:var(--green-bright);line-height:1;position:relative;}
  .order-label{font-size:12px;font-weight:700;color:var(--green-soft);text-transform:uppercase;letter-spacing:1px;margin-top:4px;}
  .orders-prep{display:flex;flex-wrap:wrap;gap:10px;flex:1;align-content:flex-start;overflow:hidden;}
  .order-num-small{display:flex;flex-direction:column;align-items:center;justify-content:center;width:110px;height:110px;border-radius:14px;border:2px solid rgba(251,146,60,.35);background:rgba(251,146,60,.07);position:relative;}
  .order-num-small.cooking{animation:cooking 1.5s ease-in-out infinite;}
  @keyframes cooking{0%,100%{border-color:rgba(251,146,60,.35);}50%{border-color:rgba(251,146,60,.8);}}
  .medium-num{font-size:48px;font-weight:900;color:var(--orange);line-height:1;}
  .prep-label{font-size:11px;font-weight:700;color:rgba(251,146,60,.7);text-transform:uppercase;letter-spacing:.8px;margin-top:4px;}
  .prep-time{font-size:11px;color:var(--yellow);margin-top:2px;font-weight:600;}
  .banner-wrap{background:linear-gradient(90deg,var(--bg3),rgba(20,38,20,.9),var(--bg3));border-top:1px solid var(--green-dim);padding:0;flex-shrink:0;overflow:hidden;height:52px;display:flex;align-items:center;}
  .banner-track{display:flex;align-items:center;white-space:nowrap;animation:scrollBanner 30s linear infinite;gap:60px;}
  .banner-item{font-size:16px;font-weight:600;color:var(--green-soft);display:flex;align-items:center;gap:10px;}
  .banner-sep{color:var(--green-dim);font-size:20px;}
  .banner-badge{background:var(--green-bright);color:#052e0f;border-radius:6px;padding:2px 10px;font-size:13px;font-weight:800;}
  @keyframes scrollBanner{0%{transform:translateX(0%);}100%{transform:translateX(-50%);}}
  .empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;gap:12px;opacity:.35;}
  .empty-icon{font-size:60px;}
  .empty-text{font-size:18px;font-weight:600;color:var(--green-soft);}
  .status-dot{width:12px;height:12px;border-radius:50%;background:var(--green-bright);display:inline-block;animation:blink 1.5s infinite;}
  @keyframes blink{0%,100%{opacity:1;}50%{opacity:.3;}}
  .live-badge{display:flex;align-items:center;gap:6px;background:rgba(74,222,128,.1);border:1px solid rgba(74,222,128,.2);border-radius:20px;padding:4px 12px;font-size:12px;font-weight:700;color:var(--green-soft);}
  .notification-bar{position:fixed;top:0;left:0;right:0;background:var(--green-bright);color:#052e0f;text-align:center;font-size:20px;font-weight:900;padding:16px;transform:translateY(-100%);transition:transform .4s;z-index:100;letter-spacing:1px;}
  .notification-bar.show{transform:translateY(0);}

  </style>
<script src="/icons.js"></script>

<link rel=stylesheet href=/css/common.css>
  <link rel="stylesheet" href="/css/theme.css">
</head>
<body>

<div class="notification-bar" id="notifBar"><span data-icon="bell"></span> Nouvelle commande prête !</div>

<div class="tv-header">
  <div class="header-logo">
    <div class="logo-icon-tv"><span data-icon="plate"></span></div>
    <div>
      <div class="logo-text-tv">Commande-IA</div>
      <div class="logo-sub-tv">Restaurant Le Jardin Vert</div>
    </div>
  </div>
  <div class="live-badge"><span class="status-dot"></span> EN DIRECT</div>
  <div class="clock-display">
    <div class="clock-time" id="clockTime">--:--:--</div>
    <div class="clock-date" id="clockDate">Chargement...</div>
  </div>
</div>

<div class="tv-body">
  <div class="section section-left">
    <div class="section-header">
      <div class="section-title title-ready"><span data-icon="check_circle"></span> Commandes prêtes</div>
      <div class="section-count count-ready" id="readyCount">0</div>
    </div>
    <div class="orders-ready" id="readyOrders">
      <div class="empty-state"><div class="empty-icon"><span data-icon="timer"></span></div><div class="empty-text">En attente...</div></div>
    </div>
  </div>
  <div class="section section-right">
    <div class="section-header">
      <div class="section-title title-prep"><span data-icon="flame"></span> En préparation</div>
      <div class="section-count count-prep" id="prepCount">0</div>
    </div>
    <div class="orders-prep" id="prepOrders">
      <div class="empty-state"><div class="empty-icon"><span data-icon="chef_hat"></span></div><div class="empty-text">Cuisine active...</div></div>
    </div>
  </div>
</div>

<div class="banner-wrap">
  <div class="banner-track" id="bannerTrack">
    <!-- filled by JS -->
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
  // NO auth check — public display (URL params: ?restaurant=ID)
  const ORIGIN = window.location.origin;
  const params = new URLSearchParams(window.location.search);
  const restaurantId = params.get('restaurant') || '';

  // Clock
  function updateClock(){
    const now=new Date();
    document.getElementById('clockTime').textContent=now.toLocaleTimeString('fr-FR');
    document.getElementById('clockDate').textContent=now.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  }
  setInterval(updateClock,1000);
  updateClock();

  let readyOrders=[];    // array of order numbers (ready to serve)
  let prepOrders=[];     // array of {num, ts} (in preparation)

  // ── LOAD RESTAURANT INFO + MENU FOR BANNER ──
  async function loadData(){
    if (!restaurantId) {
      document.querySelector('.logo-sub-tv').textContent = 'Configurez ?restaurant=ID dans l\'URL';
      return;
    }
    try {
      const [restoRes, menuRes] = await Promise.allSettled([
        fetch(`${ORIGIN}/mon-restaurant/${restaurantId}`),
        fetch(`${ORIGIN}/mon-menu/${restaurantId}`)
      ]);
      if (restoRes.status === 'fulfilled' && restoRes.value.ok) {
        const d = await restoRes.value.json();
        const name = d.nom || d.name || d.restaurant?.nom || '';
        if (name) document.querySelector('.logo-sub-tv').textContent = name;
      }
      if (menuRes.status === 'fulfilled' && menuRes.value.ok) {
        const d = await menuRes.value.json();
        const raw = d.menu || d.items || d;
        const items = (Array.isArray(raw) ? raw : []).filter(i => i.disponible !== false && i.available !== false);
        if (items.length) renderBanner(items);
      }
    } catch(e) {}
  }

  function catIcon(cat){
    const c=(cat||'').toLowerCase();
    if(c.includes('entrée')||c.includes('salade')) return '<span data-icon="salad"></span>';
    if(c.includes('plat')||c.includes('principal')) return '<span data-icon="plate"></span>';
    if(c.includes('dessert')) return '<span data-icon="cake"></span>';
    if(c.includes('boisson')) return '<span data-icon="wine"></span>';
    if(c.includes('pizza')) return '<span data-icon="pizza"></span>';
    if(c.includes('burger')) return '<span data-icon="burger"></span>';
    return '✦';
  }

  function renderBanner(items){
    const track=document.getElementById('bannerTrack');
    const displayItems = items.concat(items); // duplicate for infinite scroll
    track.innerHTML=displayItems.map(item=>{
      const nom = item.nom || item.name || '';
      const prix = parseFloat(item.prix || item.price || 0);
      const cat = item.categorie || item.category || '';
      return `<span class="banner-item">
        ${catIcon(cat)} ${nom}${prix>0?` — <span style="color:var(--green-bright)">${prix.toFixed(2).replace('.',',')} €</span>`:''}
      </span><span class="banner-sep">✦</span>`;
    }).join('');
  }

  function renderReady(){
    const container=document.getElementById('readyOrders');
    document.getElementById('readyCount').textContent=readyOrders.length;
    if(readyOrders.length===0){
      container.innerHTML='<div class="empty-state"><div class="empty-icon"><span data-icon="timer"></span></div><div class="empty-text">En attente...</div></div>';
      return;
    }
    container.innerHTML=readyOrders.slice(0,8).map((n,i)=>`
      <div class="order-num-big pulse ${i===0?'new-anim':''}">
        <div class="big-num">${n}</div>
        <div class="order-label">Commande</div>
      </div>
    `).join('');
  }

  function fmtElapsed(ts){
    const s=Math.floor((Date.now()-ts)/1000);
    const m=Math.floor(s/60);
    return m<1?'< 1 min':m+' min';
  }

  function renderPrep(){
    const container=document.getElementById('prepOrders');
    document.getElementById('prepCount').textContent=prepOrders.length;
    if(prepOrders.length===0){
      container.innerHTML='<div class="empty-state"><div class="empty-icon"><span data-icon="chef_hat"></span></div><div class="empty-text">Cuisine active...</div></div>';
      return;
    }
    container.innerHTML=prepOrders.slice(0,8).map(o=>`
      <div class="order-num-small cooking">
        <div class="medium-num">${o.num}</div>
        <div class="prep-label">En cours</div>
        <div class="prep-time" id="pt-${o.num}">~${fmtElapsed(o.ts)}</div>
      </div>
    `).join('');
  }

  function showNotification(num){
    const bar=document.getElementById('notifBar');
    bar.innerHTML='<span data-icon="bell"></span> Commande '+num+' — PRÊTE À ÊTRE SERVIE !';
    if (window.ICONS?.replaceAll) window.ICONS.replaceAll(bar);
    bar.classList.add('show');
    setTimeout(()=>bar.classList.remove('show'),5000);
  }

  // ── SOCKET.IO ──
  const socket = io(ORIGIN);
  socket.on('connect', () => {
    updateConnectionBadge(true);
    if (restaurantId) socket.emit('join-restaurant', restaurantId);
  });
  socket.on('disconnect', () => updateConnectionBadge(false));

  // New order arrived → add to prep
  socket.on('new-order', o => {
    if (!o || !o.id) return;
    if (restaurantId && o.restaurantId && o.restaurantId !== restaurantId) return;
    const num = o.num || o.id.toString().slice(-3);
    prepOrders.push({ num, ts: Date.now() });
    renderPrep();
  });

  // KDS status update → move between columns
  socket.on('kds-status', ({ id, status, num }) => {
    const orderNum = num || id.toString().slice(-3);
    if (status === 'ready') {
      // Move from prep to ready
      prepOrders = prepOrders.filter(o => o.num != orderNum);
      readyOrders.unshift(orderNum);
      if (readyOrders.length > 8) readyOrders = readyOrders.slice(0, 8);
      showNotification(orderNum);
      renderReady(); renderPrep();
    } else if (status === 'done') {
      // Served — remove from ready
      readyOrders = readyOrders.filter(n => n != orderNum);
      renderReady();
    }
  });

  // Update prep timers every 30s
  setInterval(()=>{
    prepOrders.forEach(o=>{
      const el=document.getElementById('pt-'+o.num);
      if(el) el.textContent='~'+fmtElapsed(o.ts);
    });
  },30000);

  // Initialize displays
  renderReady();
  renderPrep();
  loadData();

  // Connection status indicator
  function updateConnectionBadge(connected){
    const badge=document.querySelector('.live-badge');
    if(badge){
      badge.innerHTML=connected
        ?'<span class="status-dot"></span> EN DIRECT'
        :'<span class="status-dot" style="background:var(--orange)"></span> DÉCONNECTÉ';
    }
  }

  // Keyboard shortcuts for kiosk control
  document.addEventListener('keydown',function(e){
    if(e.key==='f'||e.key==='F'){
      if(!document.fullscreenElement){
        document.documentElement.requestFullscreen().catch(()=>{});
      } else {
        document.exitFullscreen().catch(()=>{});
      }
    }
  });

  // Page visibility — pause banner animation when tab hidden
  document.addEventListener('visibilitychange',function(){
    const banner=document.querySelector('.banner-track');
    if(banner) banner.style.animationPlayState=document.hidden?'paused':'running';
  });
</script>

<script>/* bfcache fix */window.addEventListener('pageshow',function(e){if(e.persisted)window.location.reload();});</script>
<script src=/burger-menu.js></script>
</body>
</html>
