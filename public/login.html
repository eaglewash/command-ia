<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connexion — Commande-IA</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #EEF5F2;
      min-height: 100vh;
      color: #111;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow: hidden;
    }

    /* fond : grille discrète + lueurs teal, cohérent dashboard */
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image:
        linear-gradient(rgba(14,75,71,.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(14,75,71,.035) 1px, transparent 1px);
      background-size: 44px 44px;
    }
    body::after {
      content: '';
      position: fixed; z-index: 0; pointer-events: none;
      width: 520px; height: 520px; border-radius: 50%;
      background: radial-gradient(circle, rgba(123,187,181,.22), transparent 65%);
      top: -160px; right: -120px;
    }

    .auth-wrap { position: relative; z-index: 1; width: 100%; max-width: 400px; }

    /* logo au-dessus de la carte (style topbar dashboard) */
    .brand {
      display: flex; align-items: center; justify-content: center; gap: 11px;
      margin-bottom: 22px;
    }
    .brand-icon {
      width: 40px; height: 40px; border-radius: 10px;
      background: #0E4B47; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 6px 18px rgba(14,75,71,.28);
    }
    .brand-icon svg { width: 22px; height: 22px; }
    .brand-text { font-size: 19px; font-weight: 700; color: #0F2A28; letter-spacing: -0.4px; }
    .brand-text span { color: #0E4B47; }

    /* carte */
    .login-card {
      background: #fff;
      border: 1.5px solid #B8D0C8;
      border-radius: 16px;
      box-shadow: 0 8px 28px rgba(14,75,71,.10);
      padding: 30px;
      animation: cardIn .35s ease both;
    }
    @keyframes cardIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

    .card-header { margin-bottom: 22px; }
    .card-greeting {
      display: inline-block; font-size: 11px; font-weight: 600; color: #0E4B47;
      background: #DCF0ED; border: 1px solid #7BBBB5; border-radius: 20px;
      padding: 4px 12px; margin-bottom: 12px;
    }
    .card-title { font-size: 24px; font-weight: 700; color: #0F2A28; letter-spacing: -0.5px; }
    .card-sub { font-size: 13px; color: #4D6260; margin-top: 4px; }

    /* compte récent */
    .recent-account {
      display: none; align-items: center; gap: 11px;
      background: #F8FBF9; border: 1.5px solid #B8D0C8; border-radius: 12px;
      padding: 11px 13px; margin-bottom: 16px; cursor: pointer;
      transition: border-color .15s, background .15s, transform .15s;
    }
    .recent-account:hover { border-color: #0E4B47; background: #DCF0ED; transform: translateY(-1px); }
    .recent-account.show { display: flex; }
    .ra-avatar {
      width: 34px; height: 34px; border-radius: 9px;
      background: #0E4B47; color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 14px; flex-shrink: 0;
    }
    .ra-info { flex: 1; min-width: 0; }
    .ra-name { font-size: 13px; font-weight: 600; color: #0F2A28; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ra-email { font-size: 11px; color: #4D6260; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ra-cta { font-size: 11px; font-weight: 700; color: #0E4B47; white-space: nowrap; }

    /* alerte */
    .login-alert {
      padding: 11px 13px; border-radius: 8px; font-size: 13px; font-weight: 500;
      margin-bottom: 16px; display: none; animation: aIn .2s ease;
    }
    @keyframes aIn { from { opacity:0; transform:translateY(-3px);} to { opacity:1; transform:none;} }
    .login-alert.error { background: #fef0f0; color: #b03030; border: 1.5px solid #f0c0c0; display: block; }
    .login-alert.warn  { background: #fff8e8; color: #906010; border: 1.5px solid #e8d090; display: block; }
    .login-alert.info  { background: #DCF0ED; color: #0E4B47; border: 1.5px solid #7BBBB5; display: block; }

    /* champs */
    .form-group { margin-bottom: 14px; }
    .form-label {
      font-size: 12px; font-weight: 600; color: #4D6260;
      margin-bottom: 7px; display: block;
    }
    .input-wrap { position: relative; }
    .input-icon {
      position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
      color: #7BBBB5; pointer-events: none; display: flex;
    }
    .input-icon svg { width: 16px; height: 16px; }
    .form-input {
      width: 100%; padding: 12px 42px 12px 40px;
      border-radius: 10px; border: 1.5px solid #B8D0C8;
      background: #F8FBF9; font-size: 14px;
      font-family: 'Inter', sans-serif; color: #0F2A28;
      outline: none; transition: border-color .15s, box-shadow .15s, background .15s;
    }
    .form-input::placeholder { color: #9fb8b0; }
    .form-input:focus { border-color: #0E4B47; background: #fff; box-shadow: 0 0 0 3px rgba(14,75,71,.08); }
    .form-input:hover:not(:focus) { border-color: #7BBBB5; }
    .form-input.shake { animation: shake .3s ease; }
    @keyframes shake { 0%,100%{transform:none} 25%{transform:translateX(-4px)} 75%{transform:translateX(4px)} }

    .input-right { position: absolute; right: 11px; top: 50%; transform: translateY(-50%); }
    .toggle-pwd {
      background: none; border: none; cursor: pointer; color: #7BBBB5;
      padding: 4px; border-radius: 6px; transition: color .12s; display: flex;
    }
    .toggle-pwd:hover { color: #0E4B47; }

    .caps-warn {
      display: none; align-items: center; gap: 5px;
      font-size: 11px; color: #906010; font-weight: 600; margin-top: 5px;
    }
    .caps-warn.show { display: flex; }

    .field-options { display: flex; justify-content: space-between; align-items: center; margin: 16px 0; }
    .remember-me {
      display: flex; align-items: center; gap: 7px; cursor: pointer;
      font-size: 13px; color: #4D6260; user-select: none;
    }
    .remember-me input { width: 15px; height: 15px; accent-color: #0E4B47; cursor: pointer; }

    /* bouton — style .btn dashboard */
    .login-btn {
      width: 100%; padding: 13px; border-radius: 10px; border: none;
      background: #0E4B47; color: #fff; font-size: 14px; font-weight: 600;
      font-family: 'Inter', sans-serif; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 9px;
      transition: background .15s, transform .15s, box-shadow .15s;
      box-shadow: 0 4px 14px rgba(14,75,71,.22);
    }
    .login-btn:hover:not(:disabled) { background: #0A3D3A; transform: translateY(-1px); box-shadow: 0 6px 18px rgba(14,75,71,.28); }
    .login-btn:active:not(:disabled) { transform: none; }
    .login-btn:disabled { opacity: .55; cursor: not-allowed; box-shadow: none; transform: none; }
    .login-btn svg { width: 16px; height: 16px; }

    .attempts-info { display: none; text-align: center; margin-top: 12px; font-size: 12px; font-weight: 600; color: #a05020; }
    .attempts-info.show { display: block; }
    .lockout-countdown { font-size: 18px; font-weight: 800; color: #b03030; text-align: center; display: none; margin-top: 6px; }

    .card-footer {
      text-align: center; margin-top: 20px; padding-top: 18px;
      border-top: 1px solid #DCF0ED;
      font-size: 12px; color: #9fb8b0;
    }
    .card-footer a { color: #4D6260; text-decoration: none; font-weight: 500; }
    .card-footer a:hover { color: #0E4B47; }

    /* lien retour + statut sous la carte */
    .auth-foot {
      display: flex; align-items: center; justify-content: space-between;
      margin-top: 18px; padding: 0 4px;
    }
    .back-to-site {
      display: inline-flex; align-items: center; gap: 7px;
      font-size: 12px; font-weight: 500; color: #4D6260;
      text-decoration: none; transition: color .15s, gap .2s;
    }
    .back-to-site:hover { color: #0E4B47; gap: 10px; }
    .back-to-site svg { width: 14px; height: 14px; }
    .server-badge { display: flex; align-items: center; gap: 7px; }
    .sb-dot { width: 7px; height: 7px; border-radius: 50%; background: #5ab52a; animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
    .sb-text { font-size: 11px; font-weight: 600; color: #4D6260; }

    /* overlay succès */
    .success-overlay {
      position: fixed; inset: 0; background: rgba(238,245,242,.97); backdrop-filter: blur(4px);
      z-index: 999; display: none;
      flex-direction: column; align-items: center; justify-content: center;
    }
    .success-overlay.show { display: flex; animation: fadeIn .3s ease; }
    @keyframes fadeIn { from{opacity:0} to{opacity:1} }
    .so-check { width: 76px; height: 76px; margin-bottom: 22px; animation: popIn .4s cubic-bezier(.34,1.56,.64,1); }
    @keyframes popIn { 0%{transform:scale(0);opacity:0} 100%{transform:scale(1);opacity:1} }
    .so-circle { stroke:#0E4B47; stroke-width:4; fill:none; stroke-dasharray:220; stroke-dashoffset:220; animation:drawCircle .55s ease .1s forwards; }
    @keyframes drawCircle { to{stroke-dashoffset:0} }
    .so-tick { stroke:#0E4B47; stroke-width:5; fill:none; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:60; stroke-dashoffset:60; animation:drawTick .3s ease .6s forwards; }
    @keyframes drawTick { to{stroke-dashoffset:0} }
    .so-name { font-size: 24px; font-weight: 700; color: #0F2A28; letter-spacing: -.4px; margin-bottom: 6px; }
    .so-sub { font-size: 13px; color: #4D6260; }
    .so-bar { width: 190px; height: 3px; background: #DCF0ED; border-radius: 3px; margin-top: 24px; overflow: hidden; }
    .so-bar-fill { height: 100%; background: #0E4B47; border-radius: 3px; animation: soProgress 1.2s ease forwards; }
    @keyframes soProgress { from{width:0} to{width:100%} }

    @media (max-width: 480px) {
      body { padding: 16px; }
      .login-card { padding: 22px; }
    }
  </style>
</head>
<body>

<div class="auth-wrap">

  <!-- Logo -->
  <div class="brand">
    <div class="brand-icon">
      <svg viewBox="0 0 20 20" fill="none">
        <path d="M3 6h14M3 10h9M3 14h11" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="brand-text">Commande<span>IA</span></div>
  </div>

  <!-- Carte -->
  <div class="login-card">

    <div class="card-header">
      <div class="card-greeting" id="card-greeting">Bienvenue</div>
      <div class="card-title">Connexion</div>
      <div class="card-sub">Accédez à votre espace de gestion.</div>
    </div>

    <!-- Compte récent mémorisé -->
    <div class="recent-account" id="recent-account" onclick="useRecentAccount()" title="Cliquer pour utiliser ce compte">
      <div class="ra-avatar" id="ra-avatar">?</div>
      <div class="ra-info">
        <div class="ra-name" id="ra-name">—</div>
        <div class="ra-email" id="ra-email">—</div>
      </div>
      <div class="ra-cta">Utiliser →</div>
    </div>

    <div class="login-alert" id="alert"></div>

    <!-- Email -->
    <div class="form-group">
      <label class="form-label" for="email">Email</label>
      <div class="input-wrap">
        <span class="input-icon">
          <svg viewBox="0 0 16 16" fill="none"><path d="M2 4h12v8H2z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M2 4l6 4.5L14 4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        </span>
        <input class="form-input" type="email" id="email" placeholder="votre@email.com" autocomplete="email" />
      </div>
    </div>

    <!-- Mot de passe -->
    <div class="form-group">
      <label class="form-label" for="password">Mot de passe</label>
      <div class="input-wrap">
        <span class="input-icon">
          <svg viewBox="0 0 16 16" fill="none"><rect x="3" y="7" width="10" height="7" rx="1.5" stroke="currentColor" stroke-width="1.3"/><path d="M5.5 7V5a2.5 2.5 0 015 0v2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        </span>
        <input class="form-input" type="password" id="password" placeholder="••••••••"
          onkeyup="checkCapsLock(event)" autocomplete="current-password" />
        <span class="input-right">
          <button class="toggle-pwd" type="button" onclick="togglePwd()" title="Afficher/masquer">
            <svg id="eye-icon" viewBox="0 0 16 16" fill="none" width="16" height="16">
              <path d="M1 8s2.5-5 7-5 7 5 7 5-2.5 5-7 5-7-5-7-5z" stroke="currentColor" stroke-width="1.3"/>
              <circle cx="8" cy="8" r="2" stroke="currentColor" stroke-width="1.3"/>
            </svg>
          </button>
        </span>
      </div>
      <div class="caps-warn" id="caps-warn">
        <svg viewBox="0 0 12 12" fill="none" width="11" height="11"><path d="M6 1.5L11 6H8.5v4.5h-5V6H1L6 1.5z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>
        Majuscules activées
      </div>
    </div>

    <div class="field-options">
      <label class="remember-me">
        <input type="checkbox" id="remember" /> Se souvenir de moi
      </label>
    </div>

    <button class="login-btn" id="login-btn" onclick="login()">
      <svg viewBox="0 0 16 16" fill="none" width="16" height="16"><path d="M6 3H3a1 1 0 00-1 1v8a1 1 0 001 1h3M10 5l3 3-3 3M13 8H6" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Se connecter
    </button>

    <div class="attempts-info" id="attempts-info"></div>
    <div class="lockout-countdown" id="lockout-countdown"></div>

    <div class="card-footer">
      <a href="/landing.html">Site web</a> &nbsp;·&nbsp;
      <a href="mailto:contact@commande-ia.com">Support</a>
    </div>
  </div>

  <!-- Pied : retour site + statut serveur -->
  <div class="auth-foot">
    <a href="/landing.html" class="back-to-site">
      <svg viewBox="0 0 14 14" fill="none"><path d="M9 2L4 7l5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Retour au site
    </a>
    <div class="server-badge">
      <div class="sb-dot" id="sb-dot"></div>
      <div class="sb-text" id="sb-text">Vérification…</div>
    </div>
  </div>

</div>

<!-- ══ OVERLAY SUCCÈS ══ -->
<div class="success-overlay" id="success-overlay">
  <svg class="so-check" viewBox="0 0 72 72">
    <circle class="so-circle" cx="36" cy="36" r="30"/>
    <polyline class="so-tick" points="22,36 31,46 50,26"/>
  </svg>
  <div class="so-name" id="so-name">Bienvenue !</div>
  <div class="so-sub">Redirection en cours…</div>
  <div class="so-bar"><div class="so-bar-fill"></div></div>
</div>

<script>
// ── Salutation selon l'heure ──
(function () {
  const h = new Date().getHours();
  const g = h < 6 ? 'Bonne nuit' : h < 12 ? 'Bonjour' : h < 18 ? 'Bon après-midi' : 'Bonsoir';
  document.getElementById('card-greeting').textContent = g;
})();

// ── Statut serveur ──
(async function checkServer() {
  try {
    const t0 = Date.now();
    await fetch('/ping', { signal: AbortSignal.timeout(4000) });
    const ms = Date.now() - t0;
    document.getElementById('sb-dot').style.background = ms > 600 ? '#ffcc00' : '#5ab52a';
    document.getElementById('sb-text').textContent = ms > 600 ? 'Latence élevée' : 'Système opérationnel';
  } catch {
    document.getElementById('sb-dot').style.background = '#ff5050';
    document.getElementById('sb-text').textContent = 'Hors ligne';
  }
  setTimeout(checkServer, 30000);
})();

// ── Compte récent mémorisé ──
const saved = (() => { try { return JSON.parse(localStorage.getItem('cia_remember')); } catch { return null; } })();
if (saved?.email) {
  document.getElementById('recent-account').classList.add('show');
  document.getElementById('ra-name').textContent = saved.name || saved.email;
  document.getElementById('ra-email').textContent = saved.email;
  document.getElementById('ra-avatar').textContent = (saved.name || saved.email)[0].toUpperCase();
  document.getElementById('email').value = saved.email;
  setTimeout(() => document.getElementById('password').focus(), 80);
}
function useRecentAccount() { document.getElementById('password').focus(); }
// ── Toggle mot de passe ──
let pwdVisible = false;
function togglePwd() {
  pwdVisible = !pwdVisible;
  document.getElementById('password').type = pwdVisible ? 'text' : 'password';
  document.getElementById('eye-icon').innerHTML = pwdVisible
    ? '<path d="M1 8s2.5-5 7-5 7 5 7 5-2.5 5-7 5-7-5-7-5z" stroke="currentColor" stroke-width="1.3"/><line x1="2" y1="2" x2="14" y2="14" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>'
    : '<path d="M1 8s2.5-5 7-5 7 5 7 5-2.5 5-7 5-7-5-7-5z" stroke="currentColor" stroke-width="1.3"/><circle cx="8" cy="8" r="2" stroke="currentColor" stroke-width="1.3"/>';
}

// ── Caps lock ──
function checkCapsLock(e) {
  document.getElementById('caps-warn').classList.toggle('show', !!e.getModifierState?.('CapsLock'));
}

// ── Pré-remplissage URL ──
const params = new URLSearchParams(window.location.search);
const redirect = params.get('redirect') || '/index.html';
const urlEmail = params.get('email');
if (urlEmail) { document.getElementById('email').value = urlEmail; document.getElementById('password').focus(); }
if (sessionStorage.getItem('user')) window.location.href = redirect;

// Message si session expirée (redirection depuis une page protégée)
if (params.get('reason') === 'session_expired') {
  setTimeout(() => showAlert('warn', 'Votre session a expiré — veuillez vous reconnecter.'), 100);
}

// ── Anti brute-force ──
let failCount = 0, lockUntil = 0, lockInterval = null;
function isLocked() { return Date.now() < lockUntil; }
function recordFailure() {
  failCount++;
  const left = 5 - failCount;
  const info = document.getElementById('attempts-info');
  if (left > 0 && left <= 3) { info.className = 'attempts-info show'; info.textContent = `${left} tentative${left > 1 ? 's' : ''} restante${left > 1 ? 's' : ''} avant blocage`; }
  if (failCount >= 5) {
    lockUntil = Date.now() + 30000;
    info.className = 'attempts-info show'; info.textContent = 'Compte bloqué temporairement';
    document.getElementById('login-btn').disabled = true;
    const countdown = document.getElementById('lockout-countdown');
    countdown.style.display = 'block';
    lockInterval = setInterval(() => {
      const s = Math.ceil((lockUntil - Date.now()) / 1000);
      if (s <= 0) {
        clearInterval(lockInterval);
        countdown.style.display = 'none';
        document.getElementById('login-btn').disabled = false;
        info.className = 'attempts-info';
        failCount = 0;
      } else countdown.textContent = `Réessayez dans ${s}s`;
    }, 500);
  }
  ['email', 'password'].forEach(id => {
    const el = document.getElementById(id);
    el.classList.add('shake');
    setTimeout(() => el.classList.remove('shake'), 350);
  });
}

// ── Connexion ──
async function login() {
  if (isLocked()) return;
  const email    = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const btn      = document.getElementById('login-btn');
  document.getElementById('alert').className = 'login-alert';

  if (!email || !password) {
    showAlert('error', 'Veuillez remplir tous les champs.');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Connexion…';

  try {
    const res  = await fetch('/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password }) });
    const data = await res.json();

    if (!res.ok) {
      recordFailure();
      showAlert('error', data.error || 'Identifiants incorrects.');
      btn.disabled = isLocked();
      resetBtn();
      return;
    }

    failCount = 0;
    sessionStorage.setItem('user', JSON.stringify(data.user));
    try { localStorage.removeItem('permissions_matrix_v1'); } catch {}

    // Mémorisation du compte si "Se souvenir" est coché
    try {
      if (document.getElementById('remember')?.checked) {
        localStorage.setItem('cia_remember', JSON.stringify({ email, name: data.user.prenom || data.user.nom || '' }));
      }
    } catch {}

    const name = data.user.prenom || data.user.nom || 'Vous';
    document.getElementById('so-name').textContent = 'Bienvenue, ' + name + ' !';
    document.getElementById('success-overlay').classList.add('show');
    setTimeout(() => { window.location.href = data.accountType === 'demo' ? '/landing.html' : redirect; }, 1300);

  } catch {
    showAlert('error', 'Erreur réseau — vérifiez la connexion.');
    btn.disabled = false;
    resetBtn();
  }
}

function resetBtn() {
  const btn = document.getElementById('login-btn');
  btn.innerHTML = '<svg viewBox="0 0 16 16" fill="none" width="16" height="16"><path d="M6 3H3a1 1 0 00-1 1v8a1 1 0 001 1h3M10 5l3 3-3 3M13 8H6" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg> Se connecter';
}

function showAlert(type, msg) {
  const el = document.getElementById('alert');
  el.className = 'login-alert ' + type;
  el.textContent = msg;
}

document.addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
</script>

<script>window.addEventListener('pageshow', function(e) { if (e.persisted) window.location.reload(); });</script>
</body>
</html>
